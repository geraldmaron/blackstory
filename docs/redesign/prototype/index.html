<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlackStory: Ground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the four shipping families (next/font loads these in the app) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="icon" href="brand/symbol-dark.png">
<style>
/* ============================================================
   GROUND — one surface addressed by PLACE x TIME.
   There are no destinations. There is where, when, and what
   the archive holds there.

   Design system, stated in full. The shipping app has 134 font
   sizes, 350 spacing values and 39 breakpoints; this is the
   counter-proposal and it is the whole thing.
   ============================================================ */
/* ===========================================================================
   REAL BLACKSTORY TOKENS, lifted verbatim from
   packages/ui/src/styles/tokens.css ([data-theme='dark'] + shared :root).
   Nothing here is invented. The short aliases below map onto them so the
   rest of this file reads cleanly; the values are the shipping ones.
   =========================================================================== */
:root{
  color-scheme:dark;
  /* surfaces: four value steps (Archive material law) */
  --ds-surface-sunken:#0c0b0a;
  --ds-canvas:#131110;
  --ds-surface:#1b1917;
  --ds-surface-raised:#232019;
  --ds-ink:#f4efe5;
  --ds-ink-muted:#bdb5a9;
  --ds-border:#2c2823;
  --ds-rule:#2c2823;
  --ds-overlay:rgba(0,0,0,.72);

  --ds-accent:#d07a32;
  --ds-accent-graphic:#d07a32;
  --ds-accent-muted:#d8a178;

  /* confidence: glyph still required, colour is never the only signal */
  --ds-confidence-high-fg:#a9d9b4;  --ds-confidence-high-border:#5cad73;
  --ds-confidence-medium-fg:#d4d48e;--ds-confidence-medium-border:#c4c04a;
  --ds-confidence-low-fg:#d98540;   --ds-confidence-low-border:#b86b2a;

  /* contact, NOT elevation: overlap only, never a ramp */
  --ds-contact-hairline:0 1px 0 rgb(0 0 0 / 30%);
  --ds-contact-overlap:0 2px 10px rgb(0 0 0 / 38%);
  --ds-contact-plate:0 6px 28px rgb(0 0 0 / 46%);

  /* MAP PLATE ROLES. Separation between adjacent roles is a contract
     asserted by map-contrast.test.ts (CIE L* deltas). Land is deliberately
     LIGHTER than the canvas; water is already at the floor. */
  --ds-map-land:#38332b;
  --ds-map-water:#0a0a0c;
  --ds-map-green:#3e3728;
  --ds-map-line:#665e4f;
  --ds-map-line-2:#776c5a;
  --ds-map-label:#9e9587;
  --ds-map-label-hi:#ded7c9;
  --ds-map-halo:#16130f;

  --ds-viz-1:#f4efe5; --ds-viz-2:#d07a32; --ds-viz-3:#bdb5a9;
  --ds-viz-4:#d8a178; --ds-viz-grid:#34302c;

  /* four type registers; mono is strictly data */
  --ds-font-display:'Schibsted Grotesk',system-ui,sans-serif;
  --ds-font-editorial:'Newsreader','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --ds-font-sans:'Geist','Segoe UI',system-ui,sans-serif;
  --ds-font-mono:'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace;

  --ds-space-1:.25rem; --ds-space-2:.5rem; --ds-space-3:.75rem; --ds-space-4:1rem;
  --ds-space-5:1.25rem; --ds-space-6:1.5rem; --ds-space-8:2rem; --ds-space-10:2.5rem;
  --ds-space-12:3rem; --ds-space-16:4rem;

  --ds-text-display-2:clamp(2rem,1.35rem + 2.7vw,3.25rem);
  --ds-text-display-3:clamp(1.5rem,1.22rem + 1.2vw,2.125rem);
  --ds-text-title:clamp(1.1875rem,1.08rem + .45vw,1.4375rem);
  --ds-text-subtitle:1.0625rem;
  --ds-text-body:1rem;
  --ds-text-body-sm:.9375rem;
  --ds-text-caption:.8125rem;
  --ds-text-micro:.6875rem;
  --ds-text-editorial-lede:clamp(1.125rem,1rem + .55vw,1.4375rem);

  --ds-tracking-display:-.024em; --ds-tracking-title:-.016em;
  --ds-tracking-caption:.01em;   --ds-tracking-mono:.04em;
  --ds-leading-display:1.04; --ds-leading-title:1.18;
  --ds-leading-body:1.55;    --ds-leading-editorial:1.68;

  --ds-radius-sm:8px; --ds-radius-md:14px; --ds-radius-lg:28px; --ds-radius-full:999px;
  --ds-border-width:1px; --ds-focus-width:3px; --ds-focus-offset:2px;

  --ds-duration-fast:160ms; --ds-duration-base:280ms; --ds-duration-slow:480ms;
  --ds-duration-cinematic:900ms; --ds-duration-chapter:1200ms;
  --ds-ease-entrance:cubic-bezier(.16,1,.3,1);
  --ds-ease-cinematic:cubic-bezier(.33,0,.2,1);
  --ds-ease-standard:cubic-bezier(.4,0,.2,1);

  --ds-atlas-top:88px;
  --mast-h:65px;   /* 64px min-height + 1px hairline; everything below clears it */
  --ds-rail-w:300px; --ds-results-w:344px;

  /* ---- local aliases onto the real tokens ---- */
  --void:var(--ds-surface-sunken); --canvas:var(--ds-canvas);
  --raised:var(--ds-surface); --lifted:var(--ds-surface-raised);
  --ink:var(--ds-ink); --ink-2:var(--ds-ink-muted); --ink-3:#9a9186;
  --a:var(--ds-accent); --a-hi:#e09350; --a-lo:#8e4f2a;
  /* "not recorded" borrows the olive confidence hue, not an invented blue:
     it must read as a data state inside the paper-and-ink range. */
  --cold:var(--ds-confidence-medium-fg);
  --cold-line:var(--ds-confidence-medium-border);
  --edge:var(--ds-border); --edge-hi:#3a352e;

  --t-micro:var(--ds-text-caption); --t-sm:var(--ds-text-body-sm);
  --t-body:var(--ds-text-body); --t-lead:var(--ds-text-subtitle);
  --t-title:var(--ds-text-display-3); --t-hero:var(--ds-text-display-2);

  --s1:var(--ds-space-1); --s2:var(--ds-space-2); --s3:var(--ds-space-4);
  --s4:var(--ds-space-6); --s5:var(--ds-space-10); --s6:var(--ds-space-16);
  --d-quick:var(--ds-duration-fast); --d-move:var(--ds-duration-slow);
  --d-fly:var(--ds-duration-chapter);
  --e-out:var(--ds-ease-entrance); --e-soft:var(--ds-ease-standard);
  --r-sm:var(--ds-radius-sm); --r-md:var(--ds-radius-md);
  --r-lg:var(--ds-radius-lg); --r-pill:var(--ds-radius-full);

  --f-display:var(--ds-font-display);
  --f-ui:var(--ds-font-sans);
  --f-mono:var(--ds-font-mono);
  --f-editorial:var(--ds-font-editorial);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-ui);
  font-size:var(--t-body);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--a-hi);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   THE GROUND
   ============================================================ */
/* water is already at the value floor, so the ground IS the water */
#ground{position:fixed;inset:0;overflow:hidden;z-index:0;
  background:var(--ds-map-water)}
#plate{position:absolute;top:0;left:0;width:960px;height:526.29px;transform-origin:0 0;
  transition:transform var(--d-fly) var(--e-out);will-change:transform}
#plate svg{display:block;width:960px;height:526.29px;overflow:visible;
  shape-rendering:geometricPrecision}
/* land sits a full value step ABOVE the canvas, per the map-contrast contract.
   The matching stroke closes the hairline cracks between adjacent state paths
   that made the geometry read as low-poly. */
#plate svg g{fill:var(--ds-map-land) !important;fill-opacity:1 !important}
/* state boundaries use the map-line role so the geometry reads as cartography
   rather than one flat blob. Round joins stop the 20m-simplified outline from
   reading as low-poly at continental zoom. */
#plate svg path{
  stroke:var(--ds-map-line);stroke-width:.45;stroke-opacity:.6;
  stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  transition:fill var(--d-move) var(--e-soft),stroke var(--d-move) var(--e-soft)}

/* --- ABSENCE, RENDERED (defect 1) ----------------------------
   The earlier draft washed the ENTIRE viewport in diagonal stripes,
   which read as a broken loading shimmer. The epistemic state now
   lives where it belongs: the land itself cools to the olive
   confidence hue, the spine ticks go cold, and the panel says it in
   words. Scoped to the landmass, never a full-screen overlay. ---- */
body[data-regime="unnamed"] #plate svg g{
  fill:color-mix(in oklab,var(--ds-map-land) 72%,var(--cold-line)) !important}
body[data-regime="unnamed"] #plate svg path{stroke:var(--cold-line);stroke-opacity:.45}

/* marks */
.mark{position:absolute;width:0;height:0}
.mark i{position:absolute;left:0;top:0;display:block;
  width:var(--w,9px);height:var(--w,9px);margin:calc(var(--w,9px)/-2);
  border-radius:var(--r-pill);background:var(--a);
  box-shadow:0 0 0 1px rgba(10,9,8,.8);
  transform:scale(calc(1/var(--z,1)));transform-origin:50% 50%;
  opacity:var(--conf,.85);cursor:pointer;
  transition:opacity var(--d-move) var(--e-soft)}
.mark.ctx i{cursor:default}
.mark.off{display:none}
.mark.dim i{opacity:.1}
.mark.sel i{background:var(--a-hi);opacity:1;
  box-shadow:0 0 0 1px var(--void),0 0 0 calc(6px*(1/var(--z,1))) rgba(235,152,80,.26)}
/* evidence is visible ON the ground, not only in a panel */
.mark.g1 i{width:var(--w,7px);height:var(--w,7px);
  background:transparent;border:1.5px dashed var(--a-lo);box-shadow:none}

#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  transition:background var(--d-fly) var(--e-soft)}
body[data-mode="ground"] #scrim{background:linear-gradient(180deg,rgba(10,9,8,.82) 0%,rgba(10,9,8,0) 20%,rgba(10,9,8,0) 62%,rgba(10,9,8,.86) 100%)}
body[data-mode="thread"] #scrim{background:linear-gradient(97deg,rgba(10,9,8,.9) 0%,rgba(10,9,8,.5) 44%,rgba(10,9,8,.1) 72%)}
body[data-mode="record"] #scrim{background:linear-gradient(90deg,rgba(10,9,8,.25) 0%,rgba(10,9,8,.6) 42%,rgba(10,9,8,.92) 68%)}
body[data-mode="register"] #scrim{background:rgba(10,9,8,.72)}

/* ============================================================
   MAST — where + what. No destinations.
   ============================================================ */
/* DEFECT 4 — nothing bleeds through the header any more. The old mast was a
   transparent gradient, so thread prose and the progress bar showed through it.
   It is now its own opaque surface with a hairline, at a height the Atlas
   gutters already assume (--ds-atlas-top 88px). */
#mast{position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;gap:var(--s4);
  padding:var(--ds-space-3) var(--s4);min-height:64px;
  background:color-mix(in srgb,var(--ds-canvas) 92%,transparent);
  backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
  border-bottom:var(--ds-border-width) solid var(--ds-border)}
.mast-acts{display:flex;align-items:center;gap:var(--ds-space-2);flex:none}
/* DEFECT 2 — the official lockup as artwork, never retyped.
   brand.md: "Reconstruct the lockup by typing the wordmark beside a symbol
   render" is listed under Misuse (never). The negative margins are the app's
   own measured alpha-trim ratios from command-bar.css, so the bar lays out
   around the ink rather than the PNG's transparent padding. */
.brand{--lockup:5rem;display:inline-flex;align-items:center;flex:none;
  text-decoration:none;overflow:hidden}
.brand img{flex:none;max-width:none;display:block;height:var(--lockup);
  margin-block:calc(var(--lockup) * -0.3022) calc(var(--lockup) * -0.3222);
  margin-inline:calc(var(--lockup) * -0.2533) calc(var(--lockup) * -0.1932)}
.brand .symbol{display:none;height:auto;width:2.25rem;
  margin-block:calc(2.25rem * -0.1699) calc(2.25rem * -0.2598);
  margin-inline:calc(2.25rem * -0.3281) calc(2.25rem * -0.3184)}
#where{margin-left:auto;display:flex;align-items:center;gap:var(--ds-space-2);
  background:var(--ds-surface);border:var(--ds-border-width) solid var(--ds-border);
  border-radius:var(--r-pill);padding:0 var(--ds-space-4);height:38px;
  width:min(var(--ds-results-w),32vw);flex:none;
  transition:border-color var(--d-quick) linear}
#where:focus-within{border-color:var(--a)}
#where input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-size:var(--t-sm)}
#where input::placeholder{color:var(--ink-3)}
/* DEFECT 8 — one control shape: 38px tall, pill radius, same border token. */
.mbtn{display:inline-flex;align-items:center;height:38px;padding:0 var(--ds-space-4);
  border-radius:var(--r-pill);font-size:var(--t-sm);font-family:var(--f-ui);
  background:var(--ds-surface);border:var(--ds-border-width) solid var(--ds-border);
  color:var(--ink-2);white-space:nowrap;text-decoration:none;
  transition:border-color var(--d-quick) linear,color var(--d-quick) linear,
             background var(--d-quick) linear}
.mbtn--quiet{background:transparent}
.mbtn:hover{border-color:var(--a);color:var(--ink)}
.mbtn[aria-pressed="true"]{background:var(--a);color:#190e06;border-color:var(--a);font-weight:600}

/* ============================================================
   THE DECADE SPINE — time as a real control.
   Replaces scroll-as-time. Tick length = how much the archive
   holds here, so the control is also the honesty display.
   ============================================================ */
/* DEFECT 6 — the spine was mixed orange/grey ticks at irregular spacing and
   was unreadable. Rebuilt as one legible instrument on its own surface:
   a fixed-pitch row per decade, a visible in-range band, labelled endpoints,
   and a stated interaction. Bars encode how much the archive holds. */
#spine{position:fixed;right:var(--ds-space-4);
  top:var(--ds-atlas-top);bottom:var(--ds-space-6);
  width:170px;z-index:35;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--ds-surface) 88%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:var(--ds-border-width) solid var(--ds-border);
  border-radius:var(--r-md);box-shadow:var(--ds-contact-plate);
  padding:var(--ds-space-2);overflow:hidden;
  transition:opacity var(--d-move) var(--e-soft)}
body[data-mode="record"] #spine,body[data-mode="register"] #spine{opacity:0;pointer-events:none}

.spine-hd{display:flex;flex-direction:column;gap:2px;
  padding:var(--ds-space-1) var(--ds-space-2) var(--ds-space-2);
  border-bottom:var(--ds-border-width) solid var(--ds-border);margin-bottom:var(--ds-space-1)}
.spine-hd h2{margin:0;font-family:var(--f-mono);font-size:var(--t-micro);
  letter-spacing:var(--ds-tracking-mono);text-transform:uppercase;
  color:var(--ink-3);font-weight:400}
.spine-hd b{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--a-hi);
  font-weight:500;white-space:nowrap}
.spine-rows{flex:1;display:flex;flex-direction:column;min-height:0}

.dec{position:relative;flex:1;min-height:0;display:grid;
  grid-template-columns:30px 1fr;align-items:center;gap:var(--ds-space-2);
  padding:0 var(--ds-space-2);cursor:pointer;border-radius:var(--r-sm);
  transition:background var(--d-quick) linear}
.dec:hover{background:rgba(244,239,229,.05)}
.dec .yr{font-family:var(--f-mono);font-size:var(--ds-text-micro);letter-spacing:var(--ds-tracking-mono);
  color:var(--ink-3);text-align:right;transition:color var(--d-quick) linear}
/* every tenth label is always legible; the rest fade in on range or hover */
.dec[data-major="1"] .yr{color:var(--ink-2)}
.dec[aria-current="true"] .yr{color:var(--ink)}
.dec.edge .yr{color:var(--a-hi);font-weight:500}

.dec .bar{height:3px;border-radius:2px;background:var(--ds-viz-grid);
  transition:width var(--d-move) var(--e-out),background var(--d-quick) linear}
.dec[aria-current="true"] .bar{background:var(--ds-accent-graphic)}
.dec[aria-current="true"][data-regime="unnamed"] .bar{background:var(--cold-line)}
/* The in-range span is a continuous fill, not a side accent on each row:
   the range reads as one block rather than 24 separately decorated cards. */
.dec[aria-current="true"]{background:color-mix(in srgb,var(--ds-accent) 12%,transparent)}
.dec[aria-current="true"][data-regime="unnamed"]{
  background:color-mix(in srgb,var(--cold-line) 12%,transparent)}
.dec[aria-current="true"]:hover{background:color-mix(in srgb,var(--ds-accent) 20%,transparent)}
/* only the two endpoints are marked, which is what makes the span legible */
.dec.edge{background:color-mix(in srgb,var(--ds-accent) 22%,transparent)}
.dec.edge[data-regime="unnamed"]{background:color-mix(in srgb,var(--cold-line) 22%,transparent)}
.dec.edge .yr::after{content:"";display:inline-block;width:4px;height:4px;margin-left:5px;
  border-radius:var(--r-pill);background:var(--ds-accent);vertical-align:middle}
.dec.edge[data-regime="unnamed"] .yr::after{background:var(--cold-line)}

.spine-ft{padding:var(--ds-space-2);border-top:var(--ds-border-width) solid var(--ds-border);
  margin-top:var(--ds-space-1);font-family:var(--f-mono);font-size:var(--ds-text-micro);
  line-height:1.5;color:var(--ink-3)}
.spine-ft kbd{font-family:var(--f-mono);background:var(--ds-surface-raised);
  border:var(--ds-border-width) solid var(--ds-border);border-radius:4px;padding:1px 4px;
  color:var(--ink-2)}

/* ============================================================
   CONDITIONS — census as the ambient state of the ground,
   not a page you visit.
   ============================================================ */
#cond{position:fixed;left:var(--s4);bottom:var(--s4);z-index:34;width:min(430px,46vw);
  background:rgba(18,17,16,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--edge);border-radius:var(--r-lg);padding:var(--s3) var(--s4) var(--s4);
  box-shadow:0 24px 64px -24px rgba(0,0,0,.9);
  transition:transform var(--d-move) var(--e-out),opacity var(--d-move) var(--e-soft)}
body[data-mode="record"] #cond,body[data-mode="register"] #cond,
body[data-mode="thread"] #cond{transform:translateY(130%);opacity:0;pointer-events:none}
.cond-h{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3);
  padding-bottom:10px;border-bottom:1px solid var(--edge)}
.cond-place{font-family:var(--f-display);font-size:var(--t-lead);letter-spacing:-.01em}
.cond-yr{font-family:var(--f-mono);font-size:var(--t-sm);color:var(--a-hi);margin-left:auto}
.cond-row{display:flex;gap:var(--s4);margin-bottom:var(--s3)}
.cond-row>div{min-width:0}
.cond-row b{display:block;font-family:var(--f-mono);font-size:var(--t-lead);font-weight:600;
  line-height:1.2;transition:color var(--d-move) linear}
.cond-row span{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3);
  letter-spacing:.1em;text-transform:uppercase}
/* the regime note is not a disclaimer in a drawer. it is the headline fact. */
.regime{display:flex;gap:10px;padding:11px var(--s3);border-radius:var(--r-md);
  font-size:var(--t-sm);line-height:1.5;color:var(--ink-2);
  background:rgba(111,140,163,.1);border:1px solid rgba(111,140,163,.3)}
.regime.named{background:rgba(208,122,50,.08);border-color:rgba(208,122,50,.26)}
.regime i{flex:none;width:7px;height:7px;border-radius:var(--r-pill);background:var(--cold);margin-top:7px}
.regime.named i{background:var(--a)}
.regime+.regime{margin-top:var(--s2)}
.coll-basis{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--a-hi);
  letter-spacing:.06em;margin:0 0 var(--s3);line-height:1.5}
.unmap{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--cold);
  line-height:1.55;margin:0 0 var(--s3)}
.censusbtn{margin-top:var(--s3);width:100%;min-height:44px;padding:10px;border-radius:var(--r-md);
  border:1px solid var(--edge);color:var(--ink-2);font-size:var(--t-sm);
  transition:border-color var(--d-quick) linear,color var(--d-quick) linear}
.censusbtn:hover{border-color:var(--a);color:var(--ink)}
.censusbtn[aria-pressed="true"]{border-color:var(--a);color:var(--ink)}
#censusbox{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--edge)}
.censusnote{display:flex;flex-direction:column;gap:7px;margin:var(--s2) 0 0;
  font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3);line-height:1.55}
.dec.edge .bar{box-shadow:0 0 0 1px var(--a-hi)}

/* ============================================================
   THREADS — scroll-driven narrative. The loved effect, now the
   universal storytelling primitive instead of a door you leave.
   ============================================================ */
#thread{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;
  opacity:0;pointer-events:none;transition:opacity var(--d-move) var(--e-soft)}
body[data-mode="thread"] #thread{opacity:1;pointer-events:auto}
#thread{padding-top:var(--mast-h)}
.step{min-height:100svh;display:flex;align-items:center;
  padding:var(--s6) var(--s6) var(--s6) var(--s6);
  width:min(560px,52vw)}
.step-card{width:min(440px,100%);padding:var(--s4);border-radius:var(--r-lg);
  background:linear-gradient(165deg,rgba(27,25,23,.94),rgba(18,17,16,.9));
  backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15);
  border:1px solid var(--edge);
  box-shadow:0 30px 78px -26px rgba(0,0,0,.92),inset 0 1px 0 rgba(243,238,228,.07);
  opacity:0;transform:translateY(30px) scale(.987);
  transition:opacity var(--d-move) var(--e-soft),transform var(--d-move) var(--e-out)}
.step.live .step-card{opacity:1;transform:none}
.step:first-child .step-card{opacity:1;transform:none}
.step-at{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--a);
  letter-spacing:.16em;display:flex;align-items:center;gap:10px;margin-bottom:var(--s3)}
.step-at::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--a-lo),transparent)}
.step-h{font-family:var(--f-display);font-size:var(--t-title);line-height:1.14;
  letter-spacing:-.02em;margin:0 0 var(--s3)}
.step-h em{font-style:italic;color:var(--a-hi)}
.step-p{font-size:var(--t-body);color:var(--ink-2);margin:0 0 var(--s3)}
.step-p a{color:var(--ink);text-decoration:none;
  background:linear-gradient(transparent 62%,rgba(208,122,50,.3) 62%);
  border-bottom:1px solid var(--a-lo)}
.srcline{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3);
  line-height:1.6;padding-top:10px;border-top:1px solid var(--edge);margin:var(--s3) 0 0}

/* DIGNITY: at a site of violence the camera does not perform. */
.step.still .step-card{border-color:rgba(111,140,163,.4)}
.still-note{display:flex;gap:9px;align-items:flex-start;margin:0 0 var(--s3);
  font-family:var(--f-mono);font-size:var(--t-micro);line-height:1.6;color:#9db4c6}
.still-note i{flex:none;width:7px;height:7px;border-radius:var(--r-pill);
  background:var(--cold);margin-top:6px}

/* a link that is juxtaposition, not documented causation, says so */
.adj{border-bottom:1px dotted var(--ink-3) !important;background:none !important;color:var(--ink-2) !important}

#tprog{position:fixed;top:calc(var(--mast-h) - 2px);left:0;height:2px;background:var(--a);z-index:61;width:0;display:none;
  transition:width 90ms linear}
body[data-mode="thread"] #tprog{display:block}


/* ============================================================
   THE REGISTER — the same state, projected as a list.
   A lens over the ground, not a different place.
   ============================================================ */
#reg{position:fixed;left:0;right:0;bottom:0;top:var(--mast-h);z-index:30;
  background:linear-gradient(180deg,rgba(18,17,16,.97),rgba(10,9,8,.99));
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-top:1px solid var(--edge-hi);border-radius:var(--r-lg) var(--r-lg) 0 0;
  transform:translateY(101%);transition:transform var(--d-move) var(--e-out);
  display:flex;flex-direction:column}
body[data-mode="register"] #reg{transform:none}
.reg-top{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--edge);flex-wrap:wrap}
.reg-ttl{font-family:var(--f-display);font-size:var(--t-lead)}
.reg-sub{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3);
  letter-spacing:.1em;text-transform:uppercase}
.reg-sort{display:flex;gap:2px;background:rgba(10,9,8,.6);border:1px solid var(--edge);
  border-radius:var(--r-pill);padding:3px;margin-left:auto}
.reg-sort button{padding:6px 13px;border-radius:var(--r-pill);font-size:var(--t-micro);color:var(--ink-2)}
.reg-sort button[aria-pressed="true"]{background:var(--a);color:#190e06;font-weight:600}
/* the query controls: canonical, keyboard-reachable, independent of the camera */
.reg-q{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--edge);background:rgba(10,9,8,.4)}
.reg-q label{display:flex;flex-direction:column;gap:5px;font-family:var(--f-mono);
  font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.reg-q select{min-height:38px;padding:7px 10px;border-radius:var(--r-sm);
  background:var(--raised);color:var(--ink);border:1px solid var(--edge);
  font-family:var(--f-ui);font-size:var(--t-sm);text-transform:none;letter-spacing:0}
.reg-q select:focus-visible{border-color:var(--a)}
.nomap{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--cold);
  font-weight:400;letter-spacing:.06em}
.reg-body{flex:1;overflow-y:auto;padding:var(--s2) var(--s4) var(--s6)}
.reg-row{display:grid;grid-template-columns:1fr 150px 74px 108px;gap:var(--s3);align-items:center;
  width:100%;text-align:left;padding:13px var(--s3);border-radius:var(--r-sm);
  border-bottom:1px solid var(--edge);transition:background var(--d-quick) linear}
.reg-row:hover{background:rgba(243,238,228,.05)}
.reg-row b{font-weight:500;font-size:var(--t-body)}
.reg-row .m{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3)}
.reg-head{display:grid;grid-template-columns:1fr 150px 74px 108px;gap:var(--s3);
  padding:0 var(--s3) 10px;font-family:var(--f-mono);font-size:var(--t-micro);
  color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--edge-hi)}
.ev-pips{display:inline-flex;gap:3px}
.ev-pips i{width:6px;height:6px;border-radius:var(--r-pill);background:var(--ds-viz-grid)}
.ev-pips i.on{background:var(--ds-confidence-low-fg)}
.ev-pips[data-c="2"] i.on{background:var(--ds-confidence-medium-fg)}
.ev-pips[data-c="3"] i.on{background:var(--ds-confidence-high-fg)}

/* ============================================================
   THE RECORD — the one true document. Citable terminus.
   ============================================================ */
#rec{position:fixed;top:var(--mast-h);right:0;bottom:0;width:min(640px,100vw);z-index:32;
  background:linear-gradient(180deg,rgba(27,25,23,.98),rgba(18,17,16,.99));
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-left:1px solid var(--edge-hi);box-shadow:-44px 0 96px -32px rgba(0,0,0,.94);
  overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(101%);transition:transform var(--d-move) var(--e-out)}
body[data-mode="record"] #rec{transform:none}
.rec-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--s2);
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(27,25,23,.99),rgba(27,25,23,.8));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tbtn{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--ink-2);
  padding:7px 13px;border-radius:var(--r-pill);border:1px solid var(--edge);
  transition:border-color var(--d-quick) linear,color var(--d-quick) linear}
.tbtn:hover{border-color:var(--a);color:var(--ink)}
.rec-body{padding:var(--s4) var(--s4) var(--s6)}
.rec-kind{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.18em;
  text-transform:uppercase;color:var(--a);display:block;margin-bottom:var(--s2)}
.rec-h{font-family:var(--f-display);font-size:var(--t-title);line-height:1.1;
  margin:0 0 var(--s2);letter-spacing:-.02em}
.rec-sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 var(--s4)}
.rec-fig{height:178px;border-radius:var(--r-md);margin-bottom:var(--s4);border:1px solid var(--edge);
  background:repeating-linear-gradient(42deg,rgba(208,122,50,.06) 0 12px,transparent 12px 26px),
    linear-gradient(145deg,#2a2220,#15120e);display:grid;place-items:center}
.rec-fig span{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3);
  letter-spacing:.12em;text-transform:uppercase}

/* ONE confidence vocabulary, in plain words, never a grade letter */
.conf{border:1px solid var(--edge);border-radius:var(--r-md);padding:var(--s3);
  margin-bottom:var(--s4);background:rgba(10,9,8,.45)}
.conf-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.conf-w{font-size:var(--t-sm);font-weight:600;color:var(--ds-confidence-low-fg)}
.conf[data-c="2"] .conf-w{color:var(--ds-confidence-medium-fg)}
.conf[data-c="3"] .conf-w{color:var(--ds-confidence-high-fg)}
.conf p{margin:0;font-size:var(--t-sm);color:var(--ink-2);line-height:1.55}
.conf .src{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--edge);
  font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3);line-height:1.65}

/* the citation block — this product's URLs ARE citations */
.cite-box{border:1px solid rgba(208,122,50,.3);background:rgba(208,122,50,.06);
  border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s4)}
.cite-box h3{margin:0 0 9px;font-family:var(--f-mono);font-size:var(--t-micro);
  letter-spacing:.14em;text-transform:uppercase;color:var(--a);font-weight:400}
.cite-box code{display:block;font-family:var(--f-mono);font-size:var(--t-micro);
  color:var(--ink);background:rgba(10,9,8,.6);padding:10px;border-radius:var(--r-sm);
  word-break:break-all;line-height:1.6;margin-bottom:9px}
.cite-box p{margin:0;font-size:var(--t-micro);color:var(--ink-3);line-height:1.55}

.rec-sec{margin-bottom:var(--s4)}
.rec-sec h3{font-family:var(--f-mono);font-size:var(--t-micro);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);font-weight:400;margin:0 0 10px;
  padding-bottom:8px;border-bottom:1px solid var(--edge)}
.rec-sec p{margin:0 0 var(--s2);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-pill);
  border:1px solid var(--edge);font-size:var(--t-sm);color:var(--ink-2);
  transition:border-color var(--d-quick) linear,color var(--d-quick) linear}
.chip:hover{border-color:var(--a);color:var(--ink)}
.chip i{width:6px;height:6px;border-radius:var(--r-pill);background:var(--a);flex:none}
.chip.adjc i{background:var(--ink-3)}
.relnote{font-family:var(--f-mono);font-size:var(--t-micro);color:var(--ink-3);
  margin:10px 0 0;line-height:1.55}

/* sensitivity: stated before the content, never a surprise */
.sens{display:flex;gap:10px;padding:12px var(--s3);border-radius:var(--r-md);
  background:rgba(111,140,163,.1);border:1px solid rgba(111,140,163,.32);
  font-size:var(--t-sm);line-height:1.5;color:#b9cbd8;margin-bottom:var(--s4)}
.sens i{flex:none;width:7px;height:7px;border-radius:var(--r-pill);background:var(--cold);margin-top:7px}

/* ============================================================
   ANNOTATIONS
   ============================================================ */
.tag{position:fixed;z-index:60;max-width:262px;padding:11px var(--s3);border-radius:var(--r-md);
  background:#131d26;border:1px solid #2e6187;color:#cfe4f5;font-size:var(--t-micro);
  line-height:1.5;box-shadow:0 16px 42px -14px rgba(0,0,0,.9);display:none}
body[data-tags="on"] .tag{display:block}
.tag b{display:block;color:#7fc3f5;font-family:var(--f-mono);font-size:var(--t-micro);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
#tagbtn{position:fixed;left:var(--s4);top:76px;z-index:45;padding:9px var(--s3);
  border-radius:var(--r-pill);font-size:var(--t-micro);background:rgba(18,17,16,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--edge);color:var(--ink-3)}
#tagbtn:hover{border-color:var(--a);color:var(--ink)}
body[data-mode="register"] #tagbtn,body[data-mode="record"] #tagbtn{display:none}
body[data-tags="on"] #tagbtn{background:#1c3448;border-color:#2e6187;color:#9fd3f8}

/* ============================================================
   PHONE — the ground is live here too. One breakpoint.
   ============================================================ */
@media (max-width:820px){
  :root{--s4:16px;--s5:28px;--s6:22px}
  /* the mast carries only identity and place. actions live in the thumb zone. */
  #mast{padding:10px var(--s3);gap:9px}
  #openreg,#memorial,#threadtoggle{display:none}
  /* brand.md: squeezed placements drop the lockup and show the symbol alone */
  .brand .lockup{display:none} .brand .symbol{display:block}
  #where{width:auto;flex:1;margin-left:0}

  /* the spine lies down as a bare ruler: the panel chrome does not survive
     a 62px horizontal strip, so the header collapses to one range chip and
     the keyboard hint drops (touch has no shift key). 44px touch targets. */
  #spine{right:0;left:0;top:auto;bottom:0;width:auto;height:66px;
    flex-direction:row;align-items:stretch;gap:0;padding:0 var(--ds-space-2)
      calc(var(--ds-space-2) + env(safe-area-inset-bottom));
    border:0;border-top:var(--ds-border-width) solid var(--ds-border);
    border-radius:0;box-shadow:none;
    background:color-mix(in srgb,var(--ds-canvas) 94%,transparent)}
  /* the two edge labels already state the range on a phone */
  .spine-hd{display:none}
  .spine-ft{display:none}
  .spine-rows{flex-direction:row;flex:1;align-items:stretch}
  .dec{grid-template-columns:none;display:flex;flex-direction:column;
    justify-content:flex-end;align-items:center;min-height:44px;padding:0 0 10px}
  .dec .yr{display:none}
  .dec.edge .yr{display:block;position:absolute;bottom:40px;
    background:var(--ds-surface);padding:2px 6px;border-radius:var(--r-pill);
    border:var(--ds-border-width) solid var(--ds-border)}
  .dec .bar{width:3px !important;min-height:5px;border-radius:2px}
  .dec.edge .yr::after{display:none}

  /* conditions: two readings, stacked, never colliding */
  #cond{left:var(--s3);right:var(--s3);bottom:134px;width:auto;padding:var(--s3);
    max-height:46svh;overflow-y:auto}
  .cond-h{margin-bottom:var(--s2);padding-bottom:8px}
  .cond-place{font-size:var(--t-body)}
  .cond-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2) var(--s3);margin-bottom:var(--s2)}
  .cond-row>div:nth-child(3){grid-column:1 / -1}
  .cond-row b{font-size:var(--t-body);overflow-wrap:anywhere}
  .regime{font-size:var(--t-micro);padding:9px 11px}

  .step{padding:0 var(--s3) 150px;align-items:flex-end;min-height:100svh;width:auto}
  .step-card{width:100%;padding:var(--s3)}
  .step-h{font-size:24px}
  #rec{width:100vw;top:auto;height:90svh;border-left:0;border-top:1px solid var(--edge-hi);
    border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(101%)}
  body[data-mode="record"] #rec{transform:none}
  #reg{top:var(--mast-h)}
  .reg-top{padding:var(--s3)}
  .reg-sort{margin-left:0;width:100%;overflow-x:auto}
  .reg-row,.reg-head{grid-template-columns:1fr 64px;gap:var(--s2)}
  .reg-row .hide-s,.reg-head .hide-s{display:none}
  .reg-row{padding:14px var(--s2);min-height:44px}
  #tagbtn{top:calc(var(--mast-h) + 8px);bottom:auto;right:var(--s3);left:auto}
  .tag{max-width:min(262px,calc(100vw - 22px))}
}
#mobnav{display:none;position:fixed;left:var(--s3);right:var(--s3);bottom:78px;z-index:34;gap:var(--s2)}
#mobnav button{flex:1;min-height:44px;padding:11px;border-radius:var(--r-pill);font-size:var(--t-sm);
  background:rgba(27,25,23,.94);border:1px solid var(--edge);color:var(--ink);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
@media (max-width:820px){
  #mobnav{display:flex}
  body[data-mode="record"] #mobnav,body[data-mode="register"] #mobnav,
  body[data-mode="thread"] #mobnav{display:none}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  #plate,.step-card,#rec,#reg{transition-duration:.01ms !important}
}
</style>

      <option value="3">Well evidenced</option></select></label>
    <label>Sort
      <select id="fsort"><option value="year">Date</option><option value="name">Name</option>
      <option value="conf">Evidence</option><option value="place">Place</option></select></label>
    <button class="tbtn" id="freset">Reset</button>
  </div>
  <div class="reg-body">
    <div class="reg-head"><span>Record</span><span class="hide-s">Place</span><span>Date</span><span class="hide-s">Evidence</span></div>
    <div id="regrows"></div>
  </div>
</section>

<!-- ================= RECORD ================= -->
<aside id="rec" aria-label="Record" tabindex="-1">
  <div class="rec-top">
    <button class="tbtn" id="recback">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="recbacklbl">Back to the ground</span>
    </button>
  </div>
  <div class="rec-body" id="recbody"></div>
</aside>

<button id="tagbtn">Show what changed</button>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<script>
/* ===========================================================
   GROUND
   State is exactly: place x time (+ what is selected).
   Every state is a URL. There are no destinations.
   =========================================================== */
const MAP_W=960, MAP_H=526.29;
const LON0=-124.848974, LON1=-66.885444, LAT0=24.396308, LAT1=49.384358;
const mY=d=>Math.log(Math.tan(Math.PI/4+(d*Math.PI/180)/2));
const MY0=mY(LAT0), MY1=mY(LAT1);
const px=l=>(l-LON0)/(LON1-LON0)*MAP_W;
const py=l=>(MY1-mY(l))/(MY1-MY0)*MAP_H;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const body=document.body, plate=$('#plate');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const say=m=>{$('#live').textContent=m};

const DECADES=[];for(let y=1790;y<=2020;y+=10)DECADES.push(y);

/* Census regimes. The archive's epistemic condition is DATA,
   not a footnote: before 1870 most Black people were tallied,
   not named, so the ground must not imply absence of life. */
const REGIME=y=> y<1870
  ? {k:'unnamed', t:'In '+y+' the census counted most Black people as tallies in a column, not by name. Thin ground here is a record-keeping fact, not an absence of people.'}
  : {k:'named',   t:'From 1870 the census recorded Black Americans by name, which is why places can be reconstructed household by household from here on.'};

/* ---- the archive (sample) ---- */
const R=[
 {id:'bethel',n:'Mother Bethel A.M.E. Church',k:'place',lon:-75.1514,lat:39.9428,p:'Philadelphia, Pennsylvania',y:1794,c:3,
  w:'Three independent sources agree on the address and the founding year.',
  s:'Pennsylvania Historical &amp; Museum Commission marker file, 1991; HABS PA-1683; Philadelphia deed book D-42, 1792.',
  b:'The oldest parcel of land in the United States continuously owned by Black Americans. Richard Allen bought it in 1791 and the congregation has never left it.',
  rel:[['allen','doc']]},
 {id:'allen',n:'Richard Allen',k:'person',lon:-75.1520,lat:39.9430,p:'Philadelphia, Pennsylvania',y:1794,c:3,
  w:'Birth year and biography corroborated across three independent published sources.',
  s:'Allen, R., <em>The Life Experience and Gospel Labours</em>, 1833; Newman, R., <em>Freedom&rsquo;s Prophet</em>, 2008.',

  rel:[['bethel','doc']]},
 {id:'congo',n:'Congo Square',k:'place',lon:-90.0700,lat:29.9640,p:'New Orleans, Louisiana',y:1817,c:2,

 {id:'mccoy',n:'Elijah McCoy',k:'person',lon:-83.0458,lat:42.3314,p:'Detroit, Michigan',y:1872,c:3,

 {id:'lubricator',n:'Automatic Lubricator',k:'invention',lon:-83.0458,lat:42.3300,p:'Detroit, Michigan',y:1872,c:3,
  w:'The patent itself is the source. Nothing is inferred.',
  s:'US Patent 129,843, &ldquo;Improvement in Lubricators for Steam-Engines&rdquo;, granted 23 July 1872.',
  b:'A cup that drips oil into a moving engine on its own, so the train need not stop.',
  rel:[['mccoy','doc']]},
 {id:'hayti',n:'Hayti District',k:'place',lon:-78.9000,lat:35.9870,p:'Durham, North Carolina',y:1880,c:2,
  w:'The district is documented. Much of it was demolished and parcel-level records are incomplete.',
  s:'Durham County deed records; NC Highway Historical Marker G-125.',
  b:'A self-contained Black business district, most of it cleared by urban renewal in the 1960s.',
  rel:[['bronze','adj']]},
 {id:'greenwood',n:'Greenwood District',k:'place',lon:-95.9875,lat:36.1622,p:'Tulsa, Oklahoma',y:1906,c:3,sens:true,

  s:'Oklahoma Commission to Study the Tulsa Race Riot of 1921, final report, 2001; Sanborn fire insurance maps, 1920.',

 {id:'16th',n:'16th Street Baptist Church',k:'place',lon:-86.8150,lat:33.5150,p:'Birmingham, Alabama',y:1911,c:3,sens:true,
  w:'Address, construction date and the 1963 bombing are all primary-sourced.',
  s:'National Historic Landmark nomination, 2006; FBI case file BAPBOMB, 1963.',
  b:'Four girls were killed here on a Sunday morning in September 1963. The congregation was founded in 1873 and still meets.',
  sensnote:'This record concerns the killing of children. It is presented without camera movement or flourish.',
  rel:[]},
 {id:'bronze',n:'Bronzeville',k:'place',lon:-87.6180,lat:41.8100,p:'Chicago, Illinois',y:1920,c:2,
  w:'Well documented, but the boundaries shifted and sources disagree on the southern edge.',
  s:'Drake &amp; Cayton, <em>Black Metropolis</em>, 1945; Chicago Landmark district designation, 1998.',
  b:'Where the Great Migration landed in Chicago, and where it built a city inside a city.',
  rel:[['hayti','adj'],['greenwood','adj']]},
 {id:'sweet',n:'Ossian Sweet House',k:'place',lon:-83.0100,lat:42.3700,p:'Detroit, Michigan',y:1925,c:3,
  w:'Address, trial record and outcome are all documented primary sources.',
  s:'Michigan State Historic Site, 1975; <em>People v. Sweet</em>, Wayne County Circuit Court, 1925.',
  b:'A doctor bought a house in a white neighborhood, a mob came, and the trial that followed was argued by Clarence Darrow.',
  rel:[]},
 {id:'sumner',n:'Sumner Elementary School',k:'place',lon:-95.7000,lat:39.0490,p:'Topeka, Kansas',y:1936,c:2,
  w:'The building and its role are documented. Exact 1951 enrollment figures were never published.',
  s:'National Register of Historic Places, ref. 87001283; Topeka Board of Education minutes, 1951.',
  b:'The all-white school that refused to enroll Linda Brown, seven blocks from her house.',
  rel:[['brown','doc']]},
 /* Records that cannot be drawn. They are the whole point of making the QUERY
    authoritative: a camera-driven list would delete them silently and the
    researcher would never know the bibliography was short. */
 {id:'roll',n:'Freedmen\u2019s Bureau teacher roll, Virginia',k:'event',p:'Virginia',y:1867,c:2,
  w:'The roll survives and is legible. It names teachers but not the schoolhouses, so no point can be placed.',
  s:'Bureau of Refugees, Freedmen and Abandoned Lands, Virginia superintendent of education records, 1867; NARA M1053.',
  b:'A list of teachers hired to run schools for freedpeople across Virginia in a single year.',
  rel:[]},
 {id:'withheld',n:'Oral history: a Hayti household',k:'person',p:'Durham, North Carolina',y:1968,c:2,
  withheld:true,
  w:'The interview is catalogued and quotable. The family asked that the address not be published.',
  s:'BlackStory oral history collection, interview 221, recorded 1968; release on file.',
  b:'A household account of the months before the Hayti clearances, recorded with the family\u2019s consent.',
  rel:[['hayti','doc']]},
 {id:'brown',n:'Brown v. Board of Education',k:'event',lon:-95.6890,lat:39.0558,p:'Topeka, Kansas',y:1954,c:3,
  w:'A published Supreme Court opinion, quoted from the official US Reports.',
  s:'<em>Brown v. Board of Education</em>, 347 U.S. 483 (1954), US Reports, Library of Congress.',
  b:'Held that separate educational facilities are inherently unequal, overturning the doctrine the Court set in 1896.',
  rel:[['sumner','doc']]}
];
const byId=i=>R.find(r=>r.id===i);
/* slugs and source counts, so the citation block can render the REAL format:
   lib/citation/format.ts -- it must not be re-punctuated. */
R.forEach(r=>{
  r.slug=r.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  r.nsrc=(r.s.match(/;/g)||[]).length+1;
});
const era=y=>Math.floor(y/10)*10+'s';
/* P-03 precision honesty: every mark declares how sharply its source places it. */
const PREC={bethel:'exact',allen:'exact',congo:'square',mccoy:'city',lubricator:'city',
  hayti:'district',greenwood:'district','16th':'exact',bronze:'district',sweet:'exact',
  sumner:'exact',brown:'city',roll:'none',withheld:'withheld'};
R.forEach(r=>{ r.prec=PREC[r.id]||'city'; });
const TODAY=new Date().toISOString().slice(0,10);

/* census conditions, sampled. share is of the named place. */
const COND={
 'Everything in the archive':{1790:[757208,19.3],1800:[1002037,18.9],1810:[1377808,19.0],1820:[1771656,18.4],
   1830:[2328642,18.1],1840:[2873648,16.8],1850:[3638808,15.7],1860:[4441830,14.1],1870:[4880009,12.7],
   1880:[6580793,13.1],1890:[7488788,11.9],1900:[8833994,11.6],1910:[9827763,10.7],1920:[10463131,9.9],
   1930:[11891143,9.7],1940:[12865518,9.8],1950:[15042286,10.0],1960:[18871831,10.5],1970:[22580289,11.1],
   1980:[26495025,11.7],1990:[29986060,12.1],2000:[34658190,12.3],2010:[38929319,12.6],2020:[41104200,12.4]},
 'Philadelphia, Pennsylvania':{1790:[2489,4.8],1800:[6880,8.9],1810:[9653,9.9],1820:[11891,8.8],
   1830:[14563,8.6],1840:[19833,7.4],1850:[19761,4.8],1860:[22185,3.9],1870:[22147,3.3],1880:[31699,3.7],
   1890:[39371,3.8],1900:[62613,4.8],1910:[84459,5.5],1920:[134229,7.4],1930:[219599,11.3],1940:[250880,13.0],
   1950:[376041,18.2],1960:[529240,26.4],1970:[653791,33.6],1980:[638878,37.8],1990:[631936,39.9],
   2000:[655824,43.2],2010:[661839,43.4],2020:[droppable=>0,0]},
 'Tulsa, Oklahoma':{1910:[1959,10.9],1920:[8878,12.3],1930:[15203,11.3],1940:[15300,10.5],1950:[16600,9.4],
   1960:[22000,9.5],1970:[28000,10.6],1980:[36000,10.0],1990:[48000,13.0],2000:[51000,13.0],2010:[53000,13.5],2020:[54000,14.0]},
 'Chicago, Illinois':{1890:[14271,1.3],1900:[30150,1.8],1910:[44103,2.0],1920:[109458,4.1],1930:[233903,6.9],
   1940:[277731,8.2],1950:[492265,13.6],1960:[812637,22.9],1970:[1102620,32.7],1980:[1197000,39.8],
   1990:[1087711,39.1],2000:[1065009,36.8],2010:[887608,32.9],2020:[787551,29.2]}
};
Object.values(COND).forEach(o=>{for(const k in o){ if(typeof o[k][0]==='function') delete o[k]; }});

/* ---- THE COLLECTION is the state. The ground is a VIEW of it. -----------
   Codex's fatal objection to an earlier draft: a viewport-plus-decade register
   silently drops records outside the camera and records with no coordinates,
   producing "an incomplete bibliography that looks complete". So the QUERY is
   authoritative and the map draws whatever subset of it can be drawn. --------- */
const Q={ kind:'', state:'', from:1790, to:2020, floor:1, sort:'year' };
const S={ placeLabel:'Everything in the archive', lon:-96.5, lat:38.5, zoom:1,
          sel:null, census:false, ret:null };

/* matching() is the bibliography. mappable() is only what can be drawn. */
function matching(){
  return R.filter(r=>
    (!Q.kind || r.k===Q.kind) &&
    (!Q.state || r.p.endsWith(Q.state)) &&
    r.y>=Q.from && r.y<=Q.to &&
    r.c>=Q.floor);
}
const hasCoords=r=>typeof r.lon==='number' && typeof r.lat==='number';
function mappable(){ return matching().filter(hasCoords); }
function sorted(list){
  return list.slice().sort((a,b)=>
    Q.sort==='year'?a.y-b.y:
    Q.sort==='name'?a.n.localeCompare(b.n):
    Q.sort==='conf'?b.c-a.c||a.n.localeCompare(b.n):
    a.p.localeCompare(b.p));
}
/* a plain-language statement of what produced this collection */
function basis(){
  const bits=[];
  bits.push(Q.kind?Q.kind+'s':'All records');
  if(Q.state)bits.push('in '+Q.state);
  bits.push(Q.from===1790&&Q.to===2020?'1790 to 2020':Q.from+' to '+Q.to);
  if(Q.floor>1)bits.push(({2:'partly',3:'well'})[Q.floor]+' evidenced or better');
  return bits.join(' · ');
}

/* ---- camera ---- */
let cam={lon:-96.5,lat:38.5,zoom:1};
const fit=()=>Math.min(innerWidth/MAP_W,innerHeight/MAP_H)*(innerWidth<820?1.16:1.0);
function camera(c,o){
  o=o||{}; cam=Object.assign({},cam,c);
  const s=fit()*cam.zoom, vw=innerWidth, vh=innerHeight, m=body.dataset.mode;
  let fx=.5, fy=.5;
  if(vw>=820){ if(m==='thread')fx=.66; if(m==='record')fx=.3; if(m==='ground')fx=.56; }
  else { fy = m==='record'?.26 : m==='thread'?.3 : .4; }
  plate.style.transitionDuration=(o.now||reduced)?'0ms':'var(--d-fly)';
  plate.style.transform=`translate(${vw*fx-px(cam.lon)*s}px, ${vh*fy-py(cam.lat)*s}px) scale(${s})`;
  plate.style.setProperty('--z',s);
}

/* ---- marks ---- */
const markEl={};
function buildMarks(){
  const f=document.createDocumentFragment();
  R.filter(hasCoords).forEach(r=>{
    const b=document.createElement('button');
    b.className='mark g'+r.c;
    b.style.left=px(r.lon)+'px'; b.style.top=py(r.lat)+'px';
    b.style.setProperty('--w',(r.k==='place'?10:8)+'px');
    b.style.setProperty('--conf', r.c===3?'.95':r.c===2?'.7':'.5');
    b.setAttribute('aria-label',r.n+', '+r.p+', '+r.y);
    b.innerHTML='<i></i>';
    b.addEventListener('click',e=>{e.stopPropagation();openRecord(r.id,'the ground')});
    markEl[r.id]=b; f.appendChild(b);
  });
  /* context marks so the ground reads as a real archive */
  for(let i=0;i<280;i++){
    const lon=LON0+Math.random()*(LON1-LON0), lat=LAT0+Math.random()*(LAT1-LAT0);
    const d=document.createElement('div');
    d.className='mark ctx';
    d.style.left=px(lon)+'px'; d.style.top=py(lat)+'px';
    d.style.setProperty('--w',(3+Math.random()*4).toFixed(1)+'px');
    d.style.setProperty('--conf',(.2+Math.random()*.35).toFixed(2));
    /* weighted later so early decades really are thinner */
    d.dataset.y = 1790 + Math.floor(Math.pow(Math.random(),.55)*24)*10;
    d.innerHTML='<i></i>'; f.appendChild(d);
  }
  $('#marks').appendChild(f);
}
function paintMarks(){
  const show=new Set(mappable().map(r=>r.id));
  R.forEach(r=>{const el=markEl[r.id]; if(el) el.classList.toggle('off',!show.has(r.id))});
  /* context marks follow the collection's date range too */
  $$('.mark.ctx').forEach(d=>{const y=+d.dataset.y;d.classList.toggle('off',y<Q.from||y>Q.to)});
  Object.entries(markEl).forEach(([id,el])=>el.classList.toggle('sel',id===S.sel));
}

/* ---- the decade spine: a RANGE control, and the honesty display ---- */
function decadeCount(y){
  return R.filter(r=>r.y===y||(r.y<y&&y===Q.to)).length
    + $$('.mark.ctx').filter(d=>+d.dataset.y===y).length;
}
function buildSpine(){
  $('#spinerows').innerHTML=DECADES.map(y=>{
    const g=REGIME(y);
    return `<button class="dec" data-y="${y}" data-regime="${g.k}"
      data-major="${y%50===0?1:0}"
      aria-label="${y}. Click to set the range end, shift-click to set the start."
      ><span class="yr">${y}</span><span class="bar"></span></button>`;
  }).join('');
  $$('.dec').forEach(d=>{
    const y=+d.dataset.y;
    d.addEventListener('click',e=>{ e.shiftKey?setFrom(y):setTo(y); });
    d.addEventListener('keydown',e=>{
      const i=DECADES.indexOf(y);
      const go=j=>{e.preventDefault();const t=DECADES[Math.max(0,Math.min(DECADES.length-1,j))];
        e.shiftKey?setFrom(t):setTo(t);$(`.dec[data-y="${t}"]`).focus()};
      if(e.key==='ArrowUp'||e.key==='ArrowLeft')go(i-1);
      if(e.key==='ArrowDown'||e.key==='ArrowRight')go(i+1);
      if(e.key==='Home')go(0);
      if(e.key==='End')go(DECADES.length-1);
    });
  });
}
function paintSpine(){
  const max=Math.max(1,...DECADES.map(decadeCount));
  $$('.dec').forEach(d=>{
    const y=+d.dataset.y;
    d.querySelector('.bar').style.width=(10+Math.round((decadeCount(y)/max)*100))+'%';
    const inRange=y>=Q.from&&y<=Q.to;
    d.setAttribute('aria-current',String(inRange));
    d.classList.toggle('edge', y===Q.from||y===Q.to);
  });
  $('#spinerange').textContent=Q.from===Q.to?String(Q.to):Q.from+' to '+Q.to;
}
function setFrom(y){ Q.from=Math.min(y,Q.to); repaint(); say('Range starts '+Q.from+'.'); }
function setTo(y){ Q.to=Math.max(y,Q.from); repaint(); say('Range ends '+Q.to+'. '+matching().length+' records match.'); }

/* ---- census: a SOURCED READING you ask for, never ambient atmosphere ----
   Codex: a population wash under a violence mark composes a causal argument
   nobody wrote. So it is off by default, labelled, and carries its own
   comparability break rather than animating smoothly across one. */
function condFor(place,year){
  const t=COND[place]||COND['Everything in the archive'];
  if(!t)return null;
  const ys=Object.keys(t).map(Number).filter(y=>y<=year).sort((a,b)=>b-a);
  return ys.length?{y:ys[0],v:t[ys[0]]}:null;
}
const fmt=n=>n.toLocaleString('en-US');
function paintCensus(){
  const box=$('#censusbox');
  box.hidden=!S.census;
  $('#censustoggle').setAttribute('aria-pressed',String(S.census));
  $('#censustoggle').textContent=S.census?'Hide the census reading':'Show the census reading';
  if(!S.census)return;
  const key=S.placeLabel in COND?S.placeLabel:'Everything in the archive';
  const c=condFor(key,Q.to);
  if(c){
    $('#cpop').textContent=fmt(c.v[0]);
    $('#cshare').textContent=c.v[1].toFixed(1)+'%';
  } else { $('#cpop').textContent='Not surveyed'; $('#cshare').textContent='Not surveyed'; }
  const notes=[];
  notes.push('Decennial census'+(c?', '+c.y:'')+(c&&c.y!==Q.to?' (the nearest survey to '+Q.to+'; the census does not observe between its dates)':'')+'.');
  if(Q.from<1870&&Q.to>=1870)
    notes.push('This range crosses 1870. Before it most Black people were counted as tallies without names, so figures either side are not one continuous series.');
  if(Q.from<2000&&Q.to>=2000)
    notes.push('This range crosses 2000, when respondents could first select more than one race. The definition changes here.');
  notes.push('Population counts do not explain any individual record on this ground.');
  $('#censusnote').innerHTML=notes.map(n=>'<span>'+n+'</span>').join('');
}

/* ---- absence: four different things, never collapsed into one ---- */
function paintAbsence(){
  const m=matching().length, box=$('#absence'), out=[];
  if(m===0){
    out.push(['cold','No record in the archive matches this collection. That is a statement '
      +'about this query and about what has been catalogued, not about what happened.']);
  }
  if(Q.from<1870){
    out.push(['cold','Documented coverage limit: before 1870 the federal census counted most '
      +'Black people as tallies in a column, not by name. Thin ground here is a record-keeping '
      +'fact. It is not evidence that fewer people lived here.']);
  }
  box.innerHTML=out.map(([k,t])=>`<p class="regime"><i></i><span>${t}</span></p>`).join('');
  body.dataset.regime=Q.to<1870?'unnamed':'named';
}

function paintCollection(){
  $('#condplace').textContent=S.placeLabel;
  $('#condyr').textContent=Q.from===Q.to?String(Q.to):Q.from+' to '+Q.to;
  $('#collbasis').textContent=basis();
  const m=matching(), g=mappable();
  $('#cmatch').textContent=fmt(m.length);
  $('#cmap').textContent=fmt(g.length);
  const miss=m.length-g.length;
  const u=$('#unmap');
  u.hidden=miss===0;
  if(miss) u.textContent=miss+' of these '+m.length+' have no coordinates precise enough to draw. '
    +'They are in the register and in any citation of this collection.';
}

function paintReg(){
  const list=sorted(matching());
  $('#regsub').textContent=basis()+' · '+list.length+' records';
  const pips=n=>[1,2,3].map(i=>'<i class="'+(n>=i?'on':'')+'"></i>').join('');
  $('#regrows').innerHTML=list.map(r=>`
    <button class="reg-row" data-rec="${r.id}">
      <b>${r.n}${hasCoords(r)?'':' <span class="nomap">not on the ground</span>'}</b>
      <span class="m hide-s">${r.p}</span>
      <span class="m">${r.y}</span>
      <span class="hide-s"><span class="ev-pips" data-c="${r.c}">${pips(r.c)}</span></span>
    </button>`).join('')||`<p style="padding:var(--s4);color:var(--ink-3)">
      No record matches this collection. Widen the range or lower the evidence floor.</p>`;
}

/* one repaint for every state change. */
function repaint(){ paintSpine(); paintMarks(); paintCollection(); paintAbsence();
  paintCensus(); paintReg(); url(); }

/* ---- place ---- */
function setPlace(label,lon,lat,zoom,postal){
  S.placeLabel=label; S.lon=lon; S.lat=lat; S.zoom=zoom;
  if(postal!==undefined){Q.state=postal; $('#fstate').value=postal;}
  camera({lon,lat,zoom}); repaint(); say(label+'.');
}
$('#q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const t=e.target.value.trim().toLowerCase(); if(!t)return;
  /* ENTRY FROM ANY AXIS: a person, an institution, a place. The collection
     forms around whatever you arrived with; it never demands a place first. */
  const hit=R.find(r=>(r.n+' '+r.p+' '+r.k).toLowerCase().includes(t));
  if(hit){
    if(hit.y<Q.from||hit.y>Q.to){Q.from=1790;Q.to=2020;}
    S.placeLabel=hit.p; repaint(); openRecord(hit.id,'search'); return;
  }
  const place=Object.keys(COND).find(p=>p.toLowerCase().includes(t));
  if(place){ const r=R.find(x=>x.p===place);
    setPlace(place, r?r.lon:-96.5, r?r.lat:38.5, r?4.2:1); return; }
  say('Nothing matches '+t+'. A gap in the archive is not the same as an absence of history.');
});
$('#home').addEventListener('click',e=>{e.preventDefault();
  Q.kind='';Q.state='';Q.from=1790;Q.to=2020;Q.floor=1;syncFilters();
  setPlace('Everything in the archive',-96.5,38.5,1,'');mode('ground')});

/* ---- URL: the COLLECTION is the address. Named place and decades only,
   never raw coordinates (url-state.ts:168-183 keeps camera out of links). ---- */
function url(){
  const p=new URLSearchParams();
  if(Q.kind)p.set('kind',Q.kind);
  if(Q.state)p.set('state',Q.state);
  if(Q.from!==1790)p.set('from',Q.from);
  if(Q.to!==2020)p.set('to',Q.to);
  if(Q.floor>1)p.set('floor','CBA'[Q.floor-1]);
  if(Q.sort!=='year')p.set('sort',Q.sort);
  if(S.sel)p.set('record',S.sel);
  history.replaceState(null,'',p.toString()?'?'+p:location.pathname);
}

/* ---- filters: the canonical, keyboard-reachable controls ---- */
function syncFilters(){
  $('#fkind').value=Q.kind; $('#fstate').value=Q.state;
  $('#ffrom').value=Q.from; $('#fto').value=Q.to;
  $('#ffloor').value=Q.floor; $('#fsort').value=Q.sort;
}
function buildFilters(){
  const states=[...new Set(R.map(r=>r.p.split(', ').pop()))].sort();
  $('#fstate').innerHTML='<option value="">Anywhere</option>'
    +states.map(s=>`<option>${s}</option>`).join('');
  const opts=DECADES.map(y=>`<option value="${y}">${y}</option>`).join('');
  $('#ffrom').innerHTML=opts; $('#fto').innerHTML=opts;
  syncFilters();
  $('#fkind').onchange=e=>{Q.kind=e.target.value;repaint()};
  $('#fstate').onchange=e=>{Q.state=e.target.value;repaint()};
  $('#ffrom').onchange=e=>{Q.from=Math.min(+e.target.value,Q.to);syncFilters();repaint()};
  $('#fto').onchange=e=>{Q.to=Math.max(+e.target.value,Q.from);syncFilters();repaint()};
  $('#ffloor').onchange=e=>{Q.floor=+e.target.value;repaint()};
  $('#fsort').onchange=e=>{Q.sort=e.target.value;repaint()};
  $('#freset').onclick=()=>{Q.kind='';Q.state='';Q.from=1790;Q.to=2020;Q.floor=1;Q.sort='year';
    syncFilters();repaint();say('Collection reset.')};
}
$('#censustoggle').addEventListener('click',()=>{S.census=!S.census;paintCensus();
  say(S.census?'Census reading shown, with its sources and its breaks.':'Census reading hidden.')});

/* ---- modes: postures of ONE surface. No navigation happens. ---- */
function mode(m){
  body.dataset.mode=m;
  $('#openreg').setAttribute('aria-pressed',String(m==='register'));
  const t=$('#threadtoggle'), inThread=m==='thread';
  t.setAttribute('aria-pressed',String(inThread));
  t.textContent=inThread?'Leave the thread':'Follow a thread';
  camera({});
}

/* ---- THE RECORD: a document. The panel is an enhancement over the real,
   server-rendered /place/{slug} page, never a replacement for it. ---- */
function openRecord(id,from){
  const r=byId(id); if(!r)return;
  if(body.dataset.mode!=='record'){
    S.ret={mode:body.dataset.mode,cam:Object.assign({},cam),scroll:$('#thread').scrollTop};
  }
  S.sel=id; S.from=from||S.from;
  const whence={thread:'the thread',register:'the register',ground:'the ground'};
  $('#recbacklbl').textContent='Back to '+(whence[S.ret&&S.ret.mode]||'the ground');

  const pips=n=>[1,2,3].map(i=>'<i class="'+(n>=i?'on':'')+'"></i>').join('');
  const word={3:'Well evidenced',2:'Partly evidenced',1:'Thinly evidenced'}[r.c];
  const rel=(r.rel||[]).map(([rid,kind])=>{
    const o=byId(rid); if(!o)return '';
    return `<button class="chip ${kind==='adj'?'adjc':''}" data-rec="${o.id}"><i></i>${o.n}</button>`;
  }).join('');
  const hasAdj=(r.rel||[]).some(x=>x[1]==='adj');

  $('#recbody').innerHTML=`
    ${r.sens?`<p class="sens"><i></i><span>${r.sensnote}</span></p>`:''}
    <span class="rec-kind">${r.k}</span>
    <h2 class="rec-h">${r.n}</h2>
    <p class="rec-sub">${r.p} &middot; ${r.y}</p>
    <div class="rec-fig"><span>Archival image not shown in prototype</span></div>
    <div class="conf" data-c="${r.c}">
      <div class="conf-top"><span class="ev-pips" data-c="${r.c}">${pips(r.c)}</span><span class="conf-w">${word}</span></div>
      <p>${r.w}</p>
      <p class="src">${r.s}</p>
    </div>
    <div class="cite-box">
      <h3>Cite this record</h3>
      <code>&ldquo;${r.n}.&rdquo; BlackStory Archive, ${r.p}, ${era(r.y)}. Evidence grade ${'ABC'[3-r.c]}, ${r.nsrc} sources. Accessed ${TODAY}. https://blackstory.org/place/${r.slug}</code>
      <p>The existing citation format, unchanged. The address is the record&rsquo;s own
         server-rendered page, not a view of the ground: it does not depend on your collection,
         your decade or JavaScript.</p>
    </div>
    <div class="rec-sec"><h3>What this is</h3><p>${r.b}</p></div>
    <div class="rec-sec"><h3>Where the point sits</h3>
      <p>${
        r.prec==='exact' ? 'Drawn to the parcel. The source supports that precision.' :
        r.prec==='none' ? 'Not drawn on the ground. The source names people but no location, so there is nothing to place. It stays in the register and in any citation of this collection.' :
        r.prec==='withheld' ? 'Not drawn on the ground. The location is documented but withheld at the family’s request. The withholding is recorded here rather than hidden.' :
        'Drawn to the '+r.prec+'. The sources place it no more sharply than that, and the mark is never drawn sharper than its source.'}</p>
    </div>
    ${rel?`<div class="rec-sec"><h3>Connected records</h3><div class="chips">${rel}</div>
      ${hasAdj?`<p class="relnote">Dotted links are near in place or period. The sources do not
         state a connection, and this archive will not imply one.</p>`:''}</div>`:''}
    <div class="rec-sec"><h3>This place over time</h3>
      <p>Widen the collection to watch ${r.p.split(',')[0]} change, or
         <button class="chip" data-goyear="${Math.min(2020,Math.ceil((r.y+40)/10)*10)}"><i></i>run it on forty years</button></p>
    </div>`;

  mode('record');
  paintMarks();
  /* P-04: a sensitive record is CUT to, never flown to. An undrawable record
     moves the camera not at all, because there is nowhere honest to point it. */
  if(hasCoords(r)) camera({lon:r.lon,lat:r.lat,zoom:6.1},{now:!!r.sens});
  $('#rec').focus();
  url();
  say('Record: '+r.n+'. '+(r.sens?'Presented without camera movement.'
      :hasCoords(r)?'The ground stayed where it was.':'This record has no point on the ground.'));
}
$('#recback').addEventListener('click',()=>{
  const rt=S.ret; S.sel=null; paintMarks();
  if(!rt){mode('ground');url();return}
  mode(rt.mode);
  if(rt.mode==='thread')$('#thread').scrollTop=rt.scroll;
  camera(rt.cam); url(); say('Back where you were.');
});

$('#openreg').addEventListener('click',()=>mode(body.dataset.mode==='register'?'ground':'register'));
$('#regclose').addEventListener('click',()=>mode('ground'));
$('#mreg').addEventListener('click',()=>mode('register'));

/* ---- THREADS: the loved scroll effect, now the universal primitive ---- */
const THREAD=[
 {at:'1790 · Philadelphia',h:'A ledger open on <em>his knee</em>',
  lon:-75.1514,lat:39.9428,zoom:5.4,from:1790,to:1790,state:'Pennsylvania',place:'Philadelphia, Pennsylvania',
  p:'In the summer of 1790 a man walked up to a door with a ledger open on his knee and wrote down how many people lived behind it. For most Black households he did not write a name.',
  src:'First Census of the United States, 1790, Pennsylvania schedules.'},
 {at:'1794 · Sixth and Lombard',h:'A deed is a kind of <em>evidence</em>',
  lon:-75.1514,lat:39.9428,zoom:7.4,from:1790,to:1800,state:'Pennsylvania',place:'Philadelphia, Pennsylvania',sel:'bethel',
  p:'What the census would not hold, a deed did. <a href="#" data-rec="bethel">Mother Bethel</a> can be placed to the parcel because the purchase was written down and the paper survived.',
  src:'Philadelphia deed book D-42, 1792; HABS PA-1683.'},
 {at:'1870 · The whole field',h:'The column gets a <em>name</em>',
  lon:-93,lat:38.5,zoom:1.25,from:1790,to:1870,place:'Everything in the archive',
  p:'From 1870 the census recorded Black Americans by name. The ground thickens from here, and the thickening is a change in record-keeping as much as a change in life.',
  src:'Ninth Census of the United States, 1870.'},
 {at:'1921 · Greenwood',h:'Thirty-five blocks, <em>sixteen hours</em>',
  lon:-95.9875,lat:36.1622,zoom:6.3,from:1900,to:1920,state:'Oklahoma',place:'Tulsa, Oklahoma',sel:'greenwood',still:true,
  p:'<a href="#" data-rec="greenwood">Greenwood</a> was destroyed in 1921 and rebuilt by the people who survived it. The archive holds both facts and this thread will not animate between them.',
  src:'Oklahoma Commission to Study the Tulsa Race Riot of 1921, final report, 2001.'},
 {at:'Now',h:'The count is not the <em>history</em>',
  lon:-88,lat:37,zoom:1.5,from:1790,to:2020,place:'Everything in the archive',
  p:'It is the shadow the history cast on a government form, and it is most of what survived. Step off anywhere: the ground keeps your place and your decade.',
  src:'See the register for every record behind this thread.'}
];
function buildThread(){
  $('#thread').innerHTML=THREAD.map((s,i)=>`
    <section class="step${s.still?' still':''}" data-i="${i}">
      <div class="step-card">
        <div class="step-at">${s.at}</div>
        ${s.still?`<p class="still-note"><i></i><span>A site of mass violence. The ground
           cuts here rather than flying, and holds still.</span></p>`:''}
        <h2 class="step-h">${s.h}</h2>
        <p class="step-p">${s.p}</p>
        <p class="srcline">${s.src}</p>
      </div>
    </section>`).join('');
}
let liveStep=-1;
function updateThread(){
  if(body.dataset.mode!=='thread')return;
  const el=$('#thread');
  const max=el.scrollHeight-el.clientHeight;
  $('#tprog').style.width=(max>0?(el.scrollTop/max)*100:0)+'%';
  const mid=el.clientHeight/2;
  let win=null,best=Infinity;
  $$('.step').forEach(s=>{
    const r=s.getBoundingClientRect();
    if(r.bottom<0||r.top>el.clientHeight)return;
    const d=Math.abs((r.top+r.height/2)-mid);
    if(d<best){best=d;win=s}
  });
  $$('.step').forEach(s=>s.classList.toggle('live',s===win));
  if(!win)return;
  const i=+win.dataset.i;
  if(i===liveStep)return;
  liveStep=i;
  const s=THREAD[i];
  /* a thread step sets the COLLECTION it is arguing about, so stepping off it
     leaves you holding exactly the evidence the paragraph was built on. */
  Q.from=s.from; Q.to=s.to; Q.kind=''; Q.state=s.state||'';
  S.placeLabel=s.place; S.lon=s.lon; S.lat=s.lat; S.zoom=s.zoom; S.sel=s.sel||null;
  syncFilters(); repaint();
  /* DIGNITY: a still step cuts. it does not glide. */
  camera({lon:s.lon,lat:s.lat,zoom:s.zoom},{now:!!s.still});
  say(s.at+'. '+win.querySelector('.step-h').textContent);
}
$('#thread').addEventListener('scroll',updateThread,{passive:true});
function startThread(){
  mode('thread'); liveStep=-1; $('#thread').scrollTop=0;
  requestAnimationFrame(()=>{requestAnimationFrame(updateThread)});
  say('Thread started. Scroll to move through it. The ground follows.');
}
$('#threadtoggle').addEventListener('click',()=>{
  body.dataset.mode==='thread'?leaveThread():startThread();
});
$('#mthread')&&$('#mthread').addEventListener('click',startThread);
function leaveThread(){ mode('ground'); say('Left the thread. Your collection is kept.'); }

/* ---- delegated actions ---- */
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-rec]');
  if(r){e.preventDefault();openRecord(r.dataset.rec,body.dataset.mode);return}
  const y=e.target.closest('[data-goyear]');
  if(y){e.preventDefault();mode('ground');Q.to=Math.min(2020,+y.dataset.goyear);
     if(Q.from>Q.to)Q.from=Q.to;syncFilters();repaint()}
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(body.dataset.mode==='record')$('#recback').click();
    else if(body.dataset.mode!=='ground')mode('ground');
  }
  if(e.key==='?')body.dataset.tags=body.dataset.tags==='on'?'off':'on';
});

/* ---- annotations ---- */

 {t:'The query is authoritative',b:'A viewport-driven list silently drops records outside the camera and records with no coordinates, giving a researcher an incomplete bibliography that looks complete. Here the collection is the state and the map is one view of it: pan anywhere, the bibliography does not move.',c:'top:120px;left:50%;transform:translateX(-50%);max-width:330px'},
 {t:'Time is a control, not a scroll',b:'Scroll-as-time was rejected: it breaks find-in-page, PageDown, the scrollbar as position, and the screen-reader cursor. The spine is a keyboard-addressable range (arrows, shift, Home/End) and its tick lengths show how much the archive actually holds.',c:'top:120px;right:150px'},
 {t:'Census is a reading, not atmosphere',b:'A population wash under a violence-related mark composes a causal argument nobody wrote. So it is off by default, sourced, carries its definition breaks, and states that population counts do not explain any individual record.',c:'left:24px;bottom:210px'},
 {t:'Dignity is a mechanic',b:'At a site of mass violence the camera cuts instead of flying, and says so. Undrawable and withheld records stay in the register and in the citation rather than disappearing off a map.',c:'right:24px;bottom:120px'}
].forEach(f=>{
  const el=document.createElement('div'); el.className='tag'; el.style.cssText=f.c;
  el.innerHTML='<b>'+f.t+'</b>'+f.b; document.body.appendChild(el);
});
$('#tagbtn').addEventListener('click',()=>{
  const on=body.dataset.tags==='on';
  body.dataset.tags=on?'off':'on';
  $('#tagbtn').textContent=on?'Show what changed':'Hide annotations';
});

/* ---- boot ---- */
buildMarks(); buildSpine(); buildThread();
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get('kind'))Q.kind=p.get('kind');
  if(p.get('state'))Q.state=p.get('state');
  if(p.get('from'))Q.from=+p.get('from');
  if(p.get('to'))Q.to=+p.get('to');
  if(p.get('floor'))Q.floor='CBA'.indexOf(p.get('floor'))+1||1;
  if(p.get('sort'))Q.sort=p.get('sort');
})();
buildFilters(); repaint();
camera({lon:S.lon,lat:S.lat,zoom:S.zoom},{now:true});
url();
addEventListener('resize',()=>camera({},{now:true}));
</script>
