<!doctype html>
<meta charset="utf-8" />
<title>BlackStory lockup</title>
<!-- The mark is the brand kit's own dark lockup, placed as provided: never retyped in a live
     face, recolored, stretched or given effects (brand/guide/pages/03-usage-rules.png; the
     product follows the same rule, see apps/web/src/app/layout.tsx). The line and URL match the
     running product: Schibsted Grotesk, Newsreader italic for the accent word, Geist for the URL.
     Colors are the application's own tokens (--ds-ink #f4efe5, --ds-accent #d07a32). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=Geist:wght@300;400;500&display=block"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #f4efe5;
    --muted: #bdb5a9;
    --accent: #d07a32;
    /* How wide the lockup looks, measured on its ink rather than its canvas. 540px keeps it
       inside the 270px margins either side, clear of the action rail. */
    --mark-w: 540px;
    /* Clear space around the logo equals the symbol's height (brand guide, Usage Rules). The
       symbol is the lockup's tallest element, so that is the ink height. */
    --mark-h: calc(var(--mark-w) * 352 / 1251);
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Everything sits well inside TikTok's furniture: >420px of clear space at the
     bottom for captions, >260px at the right for the action rail, >300px at top. */
  .card {
    width: 1080px;
    padding: 0 96px;
    text-align: center;
    transform-origin: 50% 50%;
  }
  /* The kit PNG carries a wide transparent margin (alpha bounds 238,286 to 1489,638 of
     1672x941, per brand/qa/transparency-report.json). This box is exactly the visible ink, and
     the image hangs out of it by the measured margins, so centering and clear space are measured
     from the mark itself. Re-measure these numbers if the artwork is re-exported. */
  .mark {
    position: relative;
    width: var(--mark-w);
    height: var(--mark-h);
    margin: 0 auto;
  }
  .mark img {
    position: absolute;
    left: calc(var(--mark-w) * -238 / 1251);
    top: calc(var(--mark-w) * -286 / 1251);
    width: calc(var(--mark-w) * 1672 / 1251);
    height: auto;
    max-width: none;
  }
  .rule {
    width: 64px;
    height: 2px;
    background: var(--accent);
    margin: var(--mark-h) auto 46px;
    opacity: 0.9;
  }
  .line {
    font-size: 46px;
    font-weight: 400;
    letter-spacing: -0.018em;
    color: var(--ink);
    line-height: 1.25;
  }
  .line em {
    font-family: Newsreader, Georgia, serif;
    font-style: italic;
    font-weight: 400;
  }
  .url {
    margin-top: 54px;
    font-family: Geist, system-ui, sans-serif;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
<div class="card" id="card">
  <div class="mark">
    <img
      id="lockup"
      src="../../../../brand/logos/dark/BlackStory-primary-lockup-dark-transparent.png"
      alt="BlackStory"
    />
  </div>
  <div class="rule" id="rule"></div>
  <div class="line">History, pinned to <em>place</em>.</div>
  <div class="url">blackstory.app</div>
</div>
<script>
  // Driven frame-by-frame from the capture harness; nothing animates on its own.
  const card = document.getElementById('card'),
    rule = document.getElementById('rule');
  window.__brand = (markOpacity, ruleScale, scale, lift) => {
    card.style.opacity = markOpacity;
    card.style.transform = 'scale(' + scale + ') translateY(' + lift + 'px)';
    rule.style.transform = 'scaleX(' + ruleScale + ')';
  };
  window.__brand(0, 0, 1, 0);
  // Not ready until the lockup has real pixels and the faces are in. If the artwork path breaks,
  // the harness times out and the capture fails instead of rendering a card with no logo.
  Promise.all([document.getElementById('lockup').decode(), document.fonts.ready]).then(() => {
    window.__ready = true;
  });
</script>
