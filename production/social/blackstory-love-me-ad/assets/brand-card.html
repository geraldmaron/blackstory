<!doctype html>
<meta charset="utf-8" />
<title>BlackStory lockup</title>
<!-- Typography matches the running product: Schibsted Grotesk 600 for the mark,
     Newsreader italic for the accent word, Geist for the URL. Colours are the
     application's own tokens (--ds-ink #f4efe5, --ds-accent #d07a32). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=Geist:wght@300;400;500&display=block"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #f4efe5;
    --muted: #bdb5a9;
    --accent: #d07a32;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Everything sits well inside TikTok's furniture: >420px of clear space at the
     bottom for captions, >260px at the right for the action rail, >300px at top. */
  .card {
    width: 1080px;
    padding: 0 96px;
    text-align: center;
    transform-origin: 50% 50%;
  }
  .mark {
    font-size: 104px;
    font-weight: 600;
    letter-spacing: -0.042em;
    color: var(--ink);
    line-height: 1;
  }
  .mark .dot {
    color: var(--accent);
  }
  .rule {
    width: 64px;
    height: 2px;
    background: var(--accent);
    margin: 46px auto;
    opacity: 0.9;
  }
  .line {
    font-size: 46px;
    font-weight: 400;
    letter-spacing: -0.018em;
    color: var(--ink);
    line-height: 1.25;
  }
  .line em {
    font-family: Newsreader, Georgia, serif;
    font-style: italic;
    font-weight: 400;
  }
  .url {
    margin-top: 54px;
    font-family: Geist, system-ui, sans-serif;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
<div class="card" id="card">
  <div class="mark">BlackStory<span class="dot">.</span></div>
  <div class="rule" id="rule"></div>
  <div class="line">History, pinned to <em>place</em>.</div>
  <div class="url">blackstory.app</div>
</div>
<script>
  // Driven frame-by-frame from the capture harness; nothing animates on its own.
  const card = document.getElementById('card'),
    rule = document.getElementById('rule');
  window.__brand = (markOpacity, ruleScale, scale, lift) => {
    card.style.opacity = markOpacity;
    card.style.transform = 'scale(' + scale + ') translateY(' + lift + 'px)';
    rule.style.transform = 'scaleX(' + ruleScale + ')';
  };
  window.__brand(0, 0, 1, 0);
  window.__ready = true;
</script>
