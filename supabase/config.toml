# BlackStory Supabase project (ADR-020).
# Target: blackstory-app (twykhihqkcldpreuovay), us-west-2.
# Do not commit secrets. Use op:// / run-with-dev-secrets for CLI tokens.

project_id = "twykhihqkcldpreuovay"

[api]
enabled = true
# The data API serves nothing readable. `submissions` left 2026-09-28 (repo-t8h9z) and
# `published` + GraphQL 2026-09-29 (repo-4wb0e): no client reads the catalog over PostgREST, and
# leaving it open let anyone with the bundle's anon key pull it uncached. The live value is the
# authenticator role's pgrst.db_schemas, set by 20260929011732_close_data_api_catalog_reads.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
# Roles for RLS live in app_metadata.app_role — never user_metadata.
# Operators are provisioned by an administrator; there is no self-service account. Applied to the
# hosted project through the management API (disable_signup=true) on 2026-09-28.
enable_signup = false

[studio]
enabled = true
