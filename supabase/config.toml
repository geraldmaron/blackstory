# BlackStory Supabase project (ADR-020).
# Target: blackstory-app (twykhihqkcldpreuovay), us-west-2.
# Do not commit secrets. Use op:// / run-with-dev-secrets for CLI tokens.

project_id = "twykhihqkcldpreuovay"

[api]
enabled = true
# Expose only schemas a browser client legitimately reads. `submissions` was removed 2026-09-28
# (repo-t8h9z): intake is written server-side only. The live value is the authenticator role's
# pgrst.db_schemas, set by migration 20260928234055_close_public_write_paths.
schemas = ["public", "published"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
# Roles for RLS live in app_metadata.app_role — never user_metadata.
# Operators are provisioned by an administrator; there is no self-service account. Applied to the
# hosted project through the management API (disable_signup=true) on 2026-09-28.
enable_signup = false

[studio]
enabled = true
