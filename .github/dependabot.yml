# Dependabot version updates + security PR alerts (BB-009).
# Alerts enable automatically once the repo exists on GitHub with Dependabot allowed.
# Grouped monthly bumps keep review load manageable; lockfiles stay the source of truth.
#
# Every ecosystem groups on '*' split by update-type, so a cycle opens at most two PRs per
# ecosystem instead of one per dependency. Ungrouped, the four entries below opened 34 PRs in
# ten days and left 21 sitting open; each one re-ran CI (12 billable min across 14 jobs) and
# Security (8 min) on every push and every rebase, and each merge to staging then fired a
# staging deploy. That was ~72% of this repo's Actions consumption.
#
# `interval: monthly` applies to VERSION updates only. Dependabot SECURITY updates are a
# separate feature driven by advisories, not by this schedule, so a vulnerability is still
# patched the day it is published.

# `main` is branch-protected and receives only deliberate staging -> main release PRs, so every
# ecosystem below targets `staging`. Without `target-branch` Dependabot opens against the default
# branch (`main`), where the bumps cannot be merged under that policy and simply accumulate.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    # apps/mobile is NOT part of the root pnpm workspace (pnpm-workspace.yaml `!apps/mobile`)
    # and carries its own npm lockfile. Dependabot does not honor that negation, so without
    # this exclusion it edits apps/mobile/package.json from the root entry and never updates
    # apps/mobile/package-lock.json — every such PR then fails `npm ci` with EUSAGE
    # ("lock file's X does not satisfy Y"). The `/apps/mobile` entry below owns those bumps.
    exclude-paths:
      - apps/mobile/**
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - javascript
    # A catch-all rather than the former eslint-prettier / typescript-tooling pairs: those
    # two grouped about a dozen packages and left the rest of the tree opening one PR each.
    groups:
      minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      major:
        patterns: ['*']
        update-types: ['major']
    # TypeScript 7 is the native port, and @typescript-eslint 8.x crashes on load against it
    # ("Cannot read properties of undefined (reading 'Cjs')"), which takes `pnpm lint` and every
    # Validate job with it. Held until @typescript-eslint ships a release that supports it.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # zod 4 changes the method signatures `packages/ops-data/src/records/types.ts` is built
      # on (TS2554, "Expected 2-3 arguments, but got 1"), so the major group PR cannot go green
      # until the migration in repo-gvus lands — 32 files against a breaking API. Left ungrouped
      # it rides with maplibre-gl and @types/node and fails the whole group, and each monthly
      # reopen re-runs Workspace Checks, Workspace Tests and Mobile Checks on a known-red branch.
      # Drop this entry when repo-gvus is done; the migration is the unblock, not the bump.
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      # @types/node tracks the Node line the repo actually runs (.nvmrc: 22). A major bump hands
      # every workspace the typings for a runtime CI and production do not use, so an API that
      # exists only in a newer Node would type-check here and fail at runtime. Move this with
      # .nvmrc, not on Dependabot's schedule.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # maplibre-gl 6 drops the default export and types paint keys strictly, so MapStage,
      # EmbeddedMap, map-plate-paint, style-application and decade-layer-transition stop
      # type-checking (23 errors), and style-spec 26 inserts a `rootKey` argument into
      # createPropertyExpression (explore-style-spec.test.ts). Everything else in the major
      # group type-checks and passes its tests, so this pair alone kept that PR red. Same shape as
      # the zod hold: drop both entries when the MapLibre 6 migration lands.
      - dependency-name: 'maplibre-gl'
        update-types: ['version-update:semver-major']
      - dependency-name: '@maplibre/maplibre-gl-style-spec'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    # apps/mobile keeps its own npm lockfile — deliberately excluded from the root pnpm
    # workspace (pnpm-workspace.yaml `!apps/mobile`) — so it needs its own Dependabot entry.
    directory: /apps/mobile
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
      - mobile
    groups:
      minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      major:
        patterns: ['*']
        update-types: ['major']
    # apps/mobile tracks Expo SDK 57's pinned version set. Three of these four bumps resolve
    # against peers Expo does not ship yet, so npm fails at install and no amount of rebasing
    # helps; they are held until an SDK upgrade moves the pins, not because the versions are bad.
    ignore:
      # Needs react-native-worklets 0.12.x; SDK 57 pins 0.10.1. SDK 57 also pins reanimated to
      # exactly 4.5.1, and Expo Doctor rejects even the 4.5.5 patch, so every newer version waits.
      - dependency-name: 'react-native-reanimated'
        versions: ['>4.5.1']
      # react-test-renderer pins an exact-ish peer on react, and SDK 57 pins react 19.2.3, so
      # every version above that fails install. 19.2.8 and 19.2.7 were both tried and both
      # resolved to a react this project does not have.
      - dependency-name: 'react-test-renderer'
        versions: ['>19.2.3']
      # eslint-plugin-import and eslint-plugin-react do not declare eslint 10 support, and
      # eslint-config-expo pulls both. The root workspace is already on eslint 10.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is the native port, and @typescript-eslint 8.x crashes on load against it
      # ("Cannot read properties of undefined (reading 'Cjs')"), which takes `npm run lint`
      # (ci.yml mobile-checks) down with it — the same crash held off on the root ecosystem's
      # typescript entry above. apps/mobile has its own lockfile and Dependabot entry, so the
      # root hold does not cover it; this workspace needs its own. Drop both together once
      # @typescript-eslint ships a release that supports TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # An Expo SDK upgrade is one coordinated move (`npx expo install expo@^<next> --fix`), not a
      # set of independent bumps: the SDK pins react and its native peers together.
      # Bumped piecemeal, the SDK 58 group left react-native-worklets 0.13.1 out of the lockfile
      # and failed `npm ci` (EUSAGE), and the minor group failed Expo Doctor on four SDK pins:
      # react and react-dom 19.3.1 against an exact 19.2.3, @types/react 19.3.0 against ~19.2.4,
      # and react-native-reanimated 4.5.5 against an exact 4.5.1 (held below). Exact pins reject
      # even a patch, so react and react-dom hold every update; the tilde pin holds minor and up.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: pip
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - python
    groups:
      minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    groups:
      minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      major:
        patterns: ['*']
        update-types: ['major']
    # Prefer Dependabot PRs that bump the pinned SHA comments in workflows.
    # Policy checker still requires immutable 40-char commit SHAs.
