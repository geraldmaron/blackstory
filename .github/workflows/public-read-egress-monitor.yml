# Manually compares public-read database egress against the script's budget.
# Only ops.public_read_egress_watermark is mutated; application behavior is unchanged.
# HOSTED_DATABASE_URL is required. Concurrent checks would corrupt the delta window.

name: Public Read Egress Monitor

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Two runs at once would each advance the watermark and halve the other's delta window.
  group: public-read-egress-monitor
  cancel-in-progress: false

jobs:
  check-egress:
    name: Compare public-read egress against budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail closed if HOSTED_DATABASE_URL is not configured
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::HOSTED_DATABASE_URL secret is not set — this monitor cannot check egress. See this workflow's header comment."
            exit 1
          fi

      - name: Compare public-read egress against budget
        run: |
          set -euo pipefail
          node --conditions development --import tsx \
            packages/ops-data/scripts/check-public-read-egress.ts
