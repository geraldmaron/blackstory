# Manually rebuilds derived release artifacts after activation or an in-place write.
# The database watermark tracks changes to release_entities and search_index.
# Unchanged content hashes avoid unnecessary uploads and CDN invalidation.
# Run locally or dispatch after a published write; no scheduler repairs missed updates.
# Requires HOSTED_DATABASE_URL and Supabase Storage credentials for public-media.

name: Publish Release Catalog Artifacts

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'FORCE=1 — publish even if the watermark is clean and hashes match'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-release-catalog-artifacts-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish entities.json / search-index.json for the active release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail closed if required secrets are not configured
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::HOSTED_DATABASE_URL secret is not set — this job cannot read published. See this workflow's header comment."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL secret is not set — this job cannot upload to Storage. See this workflow's header comment."
            exit 1
          fi
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Neither SUPABASE_SECRET_KEY nor SUPABASE_SERVICE_ROLE_KEY is set — this job cannot upload to Storage. See this workflow's header comment."
            exit 1
          fi

      - name: Publish release catalog artifacts
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          node --conditions development --import tsx \
            packages/ops-data/scripts/publish-release-catalog-artifacts.ts
