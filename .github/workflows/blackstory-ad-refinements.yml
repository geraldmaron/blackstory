name: BlackStory ad capture refinements
on:
  push:
    branches: [production/blackstory-love-me-ad-20260920]
    paths: [.github/workflows/blackstory-ad-refinements.yml]
permissions:
  contents: read
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install capture tools
        run: |
          python3 -m venv /tmp/refine-tools
          /tmp/refine-tools/bin/pip install playwright requests
          /tmp/refine-tools/bin/python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb
      - name: Capture selected city views in correct UI order
        run: |
          mkdir -p _ad_artifacts/scripts
          /tmp/refine-tools/bin/python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/scripts/blackstory-ad-capture.py').read_text()
          start=src.index("        try:\n            await goto('/explore')")
          end=src.index('        await browser.close()',start)
          replacement='''
          locations = [
              ('boston', '/explore?lat=42.3569&lng=-71.0586&zoom=11.00&selected=ent_phillis_wheatley_001'),
              ('new-orleans', '/explore?lat=29.9646&lng=-90.0722&zoom=11.00&selected=ent_treme_001'),
              ('philadelphia', '/explore?lat=39.9428&lng=-75.1514&zoom=11.00&selected=ent_mother_bethel_ame_001')]
          for name,route in locations:
              try:
                  await goto(route)
                  await settle(3)
                  dump(OUT/'inspection'/(name+'-controls.json'),await page.locator('button').evaluate_all('(a)=>a.map(x=>({text:x.innerText,label:x.getAttribute("aria-label"),title:x.title}))'))
                  await record('city-'+name+'-selected','map',hold,7)
                  close = page.get_by_role('button',name='Close record',exact=True)
                  if await close.count():
                      await close.first.click(timeout=5000)
                      await settle(2)
                  await close_filters()
                  await settle(2)
                  await record('city-'+name+'-outward','map',map_out,9)
              except Exception as exc:
                  report['errors'].append({'name':name,'error':traceback.format_exc()})
                  await save_report()
          '''
          replacement=textwrap.indent(textwrap.dedent(replacement).lstrip('\n'),'        ')
          src=src[:start]+replacement+src[end:]
          compile(src,'refinement-capture.py','exec')
          Path('_ad_artifacts/scripts/refinement-capture.py').write_text(src)
          PY
          /tmp/refine-tools/bin/python _ad_artifacts/scripts/refinement-capture.py --mode capture
          cp .github/workflows/blackstory-ad-refinements.yml _ad_artifacts/scripts/refinement-workflow.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: blackstory-ad-refinements-${{ github.run_number }}
          path: _ad_artifacts/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
