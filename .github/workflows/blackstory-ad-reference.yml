name: BlackStory Ad Reference
on:
  push:
    branches: [media/blackstory-love-me-20260920]
    paths: [.github/workflows/blackstory-ad-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Retrieve exact publicly accessible reference
        run: |
          mkdir -p output/reference
          python3 -m venv /tmp/reference-env
          /tmp/reference-env/bin/pip -q install requests 'yt-dlp[default,curl-cffi]'
          /tmp/reference-env/bin/python - <<'PY'
          import pathlib, requests, json, hashlib, subprocess, re, sys
          out = pathlib.Path('output/reference')
          vid = '7670347350115634462'
          url = f'https://www.tiktok.com/@ambnt.prod/video/{vid}'
          report = {'requested_video_id': vid, 'creator': 'ambnt.prod', 'original_url': url, 'retrieved_files': []}
          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0'
          mirror = f'https://www.tikwm.com/video/{vid}.html'
          try:
              r = session.get(mirror, timeout=35)
              r.raise_for_status()
              (out / 'mirror.html').write_text(r.text)
              report['mirror_url'] = r.url
              report['mirror_identity_matches'] = vid in r.text and 'ambnt.prod' in r.text
              if not report['mirror_identity_matches']:
                  raise RuntimeError('Mirror identity not verified')
              for name, address in [('reference.mp4', f'https://www.tikwm.com/video/media/play/{vid}.mp4'), ('reference-music.mp3', f'https://www.tikwm.com/video/music/{vid}.mp3')]:
                  try:
                      media = session.get(address, timeout=60)
                      media.raise_for_status()
                      if len(media.content) < 100000 or ('text/html' in media.headers.get('content-type', '')):
                          raise RuntimeError('Response was not a usable media file')
                      (out / name).write_bytes(media.content)
                      report['retrieved_files'].append({'file':name,'bytes':len(media.content),'sha256':hashlib.sha256(media.content).hexdigest(),'source':address,'content_type':media.headers.get('content-type')})
                  except Exception as e:
                      report[name + '_error'] = str(e)
          except Exception as e:
              report['mirror_error'] = str(e)
          if not (out / 'reference.mp4').exists():
              try:
                  command = [sys.executable, '-m', 'yt_dlp', '--no-playlist', '--write-info-json', '--socket-timeout', '20', '--retries', '1', '-o', str(out / 'direct-reference.%(ext)s'), url]
                  process = subprocess.run(command, capture_output=True, text=True, timeout=120)
                  (out / 'retrieval.log').write_text(process.stdout + process.stderr)
                  report['yt_dlp_exit'] = process.returncode
              except Exception as e:
                  report['yt_dlp_error'] = str(e)
          for f in out.iterdir():
              if f.suffix in ['.mp4','.mp3','.m4a']:
                  try:
                      p = subprocess.run(['ffprobe','-v','quiet','-show_format','-show_streams','-of','json',str(f)],capture_output=True,text=True,check=True)
                      (out / (f.name+'.probe.json')).write_text(p.stdout)
                  except Exception as e:
                      report[f.name+'_probe_error'] = str(e)
          (out / 'provenance.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Preserve exact reference and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blackstory-ad-reference
          path: output/
          retention-days: 7
          if-no-files-found: error
