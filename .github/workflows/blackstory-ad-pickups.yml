# Media-only pickups. Uses public site and immutable capture source, no deployment.
name: BlackStory Ad Pickups
on:
  push:
    branches: [media/blackstory-love-me-20260920]
    paths: [.github/workflows/blackstory-ad-pickups.yml]
permissions:
  contents: read
jobs:
  pickups:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install capture tools
        run: |
          python3 -m venv /tmp/pickup-env
          /tmp/pickup-env/bin/pip -q install playwright==1.55.0 requests beautifulsoup4 pillow pyyaml
          /tmp/pickup-env/bin/python -m playwright install --with-deps chromium
          sudo apt-get -qq install -y ffmpeg > /tmp/ffmpeg-install.log
      - name: Capture prepared native motion
        run: |
          mkdir -p output/project output/review output/assets output/captures
          cat > output/project/pickups.py <<'PY'
          import asyncio, importlib.util, json, os, pathlib, re, subprocess, traceback
          import requests,yaml
          from playwright.async_api import async_playwright
          ROOT=pathlib.Path('output')
          url='https://raw.githubusercontent.com/geraldmaron/blackstory/2a3b01c0a156662d65a1dff7200f90883e1a751d/.github/workflows/blackstory-ad-capture.yml'
          r=requests.get(url,timeout=25);r.raise_for_status()
          workflow=yaml.safe_load(r.text)
          step=next(s for s in workflow['jobs']['capture']['steps'] if s['name']=='Write and run capture source')
          code=step['run'].split("<<'PY'\n",1)[1].split('\nPY\n',1)[0]
          path=ROOT/'project'/'capture-base.py';path.write_text(code)
          spec=importlib.util.spec_from_file_location('base',path);c=importlib.util.module_from_spec(spec);spec.loader.exec_module(c)
          c.manifest['capture_pass']='prepared-native-pickups'
          async def main():
              x=subprocess.Popen(['Xvfb',':99','-screen','0','1080x2200x24','-ac','-nolisten','tcp'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              await asyncio.sleep(.6)
              try:
                  async with async_playwright() as p:
                      b=await p.chromium.launch(headless=False,env={**os.environ,'DISPLAY':':99'},args=['--disable-dev-shm-usage','--window-position=0,0','--window-size=540,1047','--force-device-scale-factor=2','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
                      ctx=await b.new_context(no_viewport=True,color_scheme='dark',reduced_motion='no-preference')
                      page=await ctx.new_page()
                      async def goto(path):
                          response=await page.goto(c.SITE+path,wait_until='domcontentloaded',timeout=45000)
                          if response and response.status>=400: raise RuntimeError('Page error '+path)
                          await c.wait_ready(page)
                      async def wait_map():
                          try:await page.wait_for_function('()=>window.__bsCaptureMap.areTilesLoaded()&&!window.__bsCaptureMap.isMoving()',timeout=20000)
                          except Exception:await page.wait_for_timeout(3000)
                          await page.wait_for_timeout(1000)
                      async def set_map(center,zoom):
                          await page.evaluate('({center,zoom})=>{window.__bsCaptureMap.jumpTo({center,zoom});return true}',{'center':center,'zoom':zoom});await wait_map()
                      async def fly(center,zoom,seconds):
                          await page.evaluate('({center,zoom,seconds})=>{window.__bsCaptureMap.flyTo({center,zoom,duration:seconds*1000,essential:true});return true}',{'center':center,'zoom':zoom,'seconds':seconds})
                          await page.wait_for_timeout(seconds*1000+150)
                      async def shot(name,surface,action):
                          try:await c.record(page,name,surface,action)
                          except Exception as exc:c.manifest['errors'].append({'stage':name,'error':str(exc)});c.save()
                      await goto('/explore')
                      hide=page.get_by_role('button',name='Hide filters')
                      if await hide.count():await hide.click();await page.wait_for_timeout(1000)
                      found=await page.evaluate(c.MAP_DISCOVERY)
                      if not found:raise RuntimeError('Native map reference missing')
                      await set_map([-96.5,38],2.15)
                      await fly([-73.949,40.805],12.1,6);await wait_map()
                      await fly([-96.5,38],2.15,6);await wait_map()
                      async def national():await fly([-94.8,38],2.18,6)
                      await shot('17-national-clean','map',national)
                      await set_map([-96.5,38],2.15)
                      async def nyc():await fly([-73.949,40.805],12.1,6);await page.wait_for_timeout(1600)
                      await shot('18-harlem-flight-clean','map',nyc)
                      async def harlem():await fly([-73.956,40.815],12.3,6)
                      await shot('19-harlem-drift-clean','map',harlem)
                      await set_map([-77.025,38.937],11.7)
                      await fly([-96.5,38],2.15,7);await wait_map()
                      await set_map([-77.025,38.937],11.7)
                      async def return_national():await fly([-96.5,38],2.15,7);await page.wait_for_timeout(1500)
                      await shot('20-national-return-clean','map',return_national)
                      async def national_hold():await fly([-95.9,38],2.17,5)
                      await shot('21-national-resolve','map',national_hold)
                      async def page_scroll(name,path,start,amount,seconds,surface):
                          try:
                              await goto(path)
                              if isinstance(start,str):
                                  element=page.locator(start).first
                                  await element.scroll_into_view_if_needed()
                                  await page.evaluate('(sel)=>{const e=document.querySelector(sel);scrollTo(0,scrollY+e.getBoundingClientRect().top-170)}',start)
                              elif start:await page.evaluate('(y)=>scrollTo(0,y)',start)
                              await page.wait_for_timeout(1000)
                              async def move():await c.smooth_scroll(page,amount,seconds)
                              await shot(name,surface,move)
                          except Exception as exc:c.manifest['errors'].append({'stage':name,'error':str(exc)});c.save()
                      await page_scroll('22-wook-record','/place/wook-tv-building',150,500,7,'entities')
                      # Actual native story images, never replacements or generated artwork.
                      await goto('/stories/the-count')
                      for name,match in [('23-constitution','Constitution_of_the_United_States'),('24-dred-scott','Dred_Scott')]:
                          try:
                              selector='img[src*="'+match+'"]'
                              image=page.locator(selector).first
                              await image.scroll_into_view_if_needed()
                              await page.wait_for_function('(sel)=>{const i=document.querySelector(sel);return i&&i.complete&&i.naturalWidth>500}',selector,timeout=15000)
                              await page.evaluate('(sel)=>{const i=document.querySelector(sel);scrollTo(0,scrollY+i.getBoundingClientRect().top-145)}',selector)
                              await page.wait_for_timeout(1200)
                              async def move():await c.smooth_scroll(page,90,7)
                              await shot(name,'stories',move)
                          except Exception as exc:c.manifest['errors'].append({'stage':name,'error':str(exc)});c.save()
                      await page_scroll('25-dubois-archive','/lives','img[src*="33880"]',95,7,'lives')
                      await page_scroll('26-lives-decades','/lives','#era-1940-1960',900,9,'lives')
                      await page_scroll('27-data-visualization','/data','#population-spine',550,8,'data')
                      await page_scroll('28-evidence-citations','/place/first-african-baptist-church',1250,700,8,'evidence')
                      await goto('/entity/ent_benjamin_banneker_001')
                      async def person():await c.smooth_scroll(page,550,7)
                      await shot('29-banneker','entities',person)
                      # Font bytes are deliberately not included in artifacts. Capture a raster
                      # typesetting reference using the live site's loaded Geist typography.
                      await page.evaluate('document.fonts.ready')
                      fonts=await page.evaluate('()=>Array.from(document.fonts).map(f=>({family:f.family,status:f.status}))')
                      (ROOT/'review'/'loaded-font-families.json').write_text(json.dumps(fonts,indent=2))
                      await b.close()
              finally:x.terminate()
          try:asyncio.run(main())
          except Exception as exc:c.manifest['errors'].append({'stage':'fatal','error':str(exc),'trace':traceback.format_exc()})
          c.save();print(json.dumps(c.manifest,indent=2))
          PY
          /tmp/pickup-env/bin/python output/project/pickups.py
      - name: Preserve prepared source footage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blackstory-ad-pickups
          path: output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
