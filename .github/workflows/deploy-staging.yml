# Staging deploy pipeline.
# Public web ships on Vercel from the staging git branch (ADR-027). This workflow pins a
# commit SHA, records provenance, and optionally smokes E2E_BASE_URL. It does not promote
# Firebase App Hosting.

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-char commit SHA that passed CI (required)
        required: true
        type: string
      confirm:
        description: Type deploy-staging to run
        required: true
        default: ''
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # One job, not five. gate, checkout-pinned, record-vercel-staging, provenance and
  # e2e-smoke each took a fresh runner and re-checked-out the same pinned commit — five
  # checkouts and five per-job billing roundings for about 79 seconds of real work, on
  # 328 runs in thirty days. `checkout-pinned` was the clearest case: its only step was a
  # checkout, and because every job gets its own runner, nothing downstream could use it.
  #
  # The one semantic change: assert-no-auto-rollout.mjs now runs against the PINNED commit
  # rather than the default ref. On a push they are the same commit. On a workflow_dispatch
  # of an older SHA it is the stricter reading — it asks whether the commit being deployed
  # disables auto-promotion, not whether today's HEAD does.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      CI_REQUIRE_E2E: ${{ vars.CI_REQUIRE_E2E }}
    steps:
      - name: Resolve pinned commit SHA
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            SHA="${{ github.sha }}"
          else
            SHA="$INPUT_SHA"
            if [[ "${{ inputs.confirm }}" != "deploy-staging" ]]; then
              echo "Refusing to run: set confirm=deploy-staging"
              exit 1
            fi
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-char git SHA"
            exit 1
          fi
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned deploy SHA: $SHA"

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.commit_sha }}

      - name: Assert automatic production deploys disabled
        run: node infra/github/release-pipeline/assert-no-auto-rollout.mjs

      - name: Public web staging is Vercel Preview from staging branch
        run: |
          SHA="${{ steps.resolve.outputs.commit_sha }}"
          echo "Public web staging: Vercel Preview for git ref staging @ ${SHA}"
          echo "Alias: https://blackstory-git-staging-geraldmarons-projects.vercel.app"
          echo "No Firebase App Hosting promote for public web (ADR-027)."

      - name: Write and validate provenance
        env:
          PROVENANCE_ENVIRONMENT: staging
          PROVENANCE_COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
          PROVENANCE_GIT_REF: ${{ github.ref }}
          PROVENANCE_REPOSITORY: ${{ github.repository }}
          PROVENANCE_REPOSITORY_ID: ${{ github.repository_id }}
          PROVENANCE_OWNER_ID: ${{ github.event.repository.owner.id }}
          PROVENANCE_WORKFLOW: ${{ github.workflow }}
          PROVENANCE_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/deploy-staging.yml@${{ github.ref }}
          PROVENANCE_RUN_ID: ${{ github.run_id }}
          PROVENANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROVENANCE_SERVER_URL: ${{ github.server_url }}
          PROVENANCE_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PROVENANCE_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-deploy-staging@black-book-efaaf.iam.gserviceaccount.com' }}
          PROVENANCE_NOTES: Staging — pinned SHA; public web on Vercel Preview (no App Hosting promote).
        run: |
          node infra/github/release-pipeline/write-provenance.mjs
          node infra/github/release-pipeline/validate-provenance.mjs artifacts/deployment-provenance.json

      - name: Upload staging provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-provenance-${{ steps.resolve.outputs.commit_sha }}
          path: artifacts/deployment-provenance.json
          if-no-files-found: error

      # This says out loud what it has been doing silently. `vars.E2E_BASE_URL` is unset on
      # this repository (actions/variables returns 0), so smoke-post-deploy.mjs has skipped on
      # every one of the last 328 runs while the job reported green — a post-deploy gate that
      # was never a gate. The notice makes that visible in the run summary instead of leaving
      # a green check to imply staging was smoked. Set E2E_BASE_URL to turn it on, and
      # CI_REQUIRE_E2E=1 to make a skip fail closed.
      - name: Warn when the post-deploy smoke has nothing to hit
        if: ${{ vars.E2E_BASE_URL == '' }}
        run: echo "::warning title=Staging smoke did not run::vars.E2E_BASE_URL is unset, so the post-deploy smoke skipped. This job's green does NOT mean staging was verified."

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Post-deploy smoke (skip without E2E_BASE_URL; fail-closed when CI_REQUIRE_E2E=1)
        run: node scripts/release/smoke-post-deploy.mjs
