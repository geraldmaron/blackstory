# Discovery campaigns — scheduled roster (ADR-018 replacement) plus manual dispatch.
#
# Replaces the 5 Firebase Functions v2 onSchedule triggers in functions/src/index.ts
# (repo-348e.4). Each scheduled job below matches the cadence in
# functions/src/schedules.ts and invokes the same underlying CLI command
# (`discovery-dispatch`) the Cloud Function called via runScheduledDiscovery.
# functions/ and firebase.discovery.json are NOT removed yet — see repo-348e.8.
#
# Kill switch: the Firebase path read `killSwitches/{id}` from Firestore
# (functions/src/kill-switch-env.ts) and failed closed (engaged) if the doc was missing.
# This workflow reads the Postgres-native equivalent, `bb_ops.kill_switches`, via
# apps/admin/scripts/check-kill-switch.mjs (same table apps/admin's /switches route reads),
# with the same fail-closed behavior, then passes the result to discovery-dispatch
# via --kill-switch.
#
# Manual runs use workflow_dispatch to exercise any discovery roster job in fixture or live
# mode. Default mode everywhere is fixture, matching DISCOVERY_MODE=fixture in
# functions/README.md ("never publish").

name: Discovery campaigns

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Scheduled discovery job id from the roster
        required: true
        type: choice
        options:
          - discovery-campaign-rss
          - discovery-campaign-wikimedia-federal
          - discovery-campaign-archive-dpla
          - discovery-campaign-web-search
          - community-obscurity-discovery
      mode:
        description: Fixture uses checked-in payloads; live may reach external sources
        required: true
        type: choice
        default: fixture
        options:
          - fixture
          - live
  schedule:
    # discovery-campaign-rss — hourly (functions/src/schedules.ts: '0 * * * *')
    - cron: '0 * * * *'
    # community-obscurity-discovery — weekly, Sundays 10:00 UTC ('0 10 * * 0')
    - cron: '0 10 * * 0'
    # discovery-campaign-wikimedia-federal — weekly, Mondays 06:00 UTC ('0 6 * * 1')
    - cron: '0 6 * * 1'
    # discovery-campaign-archive-dpla — weekly, Tuesdays 07:00 UTC ('0 7 * * 2')
    - cron: '0 7 * * 2'
    # discovery-campaign-web-search — daily 08:30 UTC ('30 8 * * *')
    - cron: '30 8 * * *'

permissions:
  contents: read

concurrency:
  group: discovery-campaigns-${{ github.workflow }}-${{ github.event_name == 'schedule' && github.event.schedule || inputs.job_id }}-${{ github.event_name == 'schedule' && 'fixture' || inputs.mode }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch discovery campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same local Postgres service pattern as ci.yml's integration-postgres job — no secret
    # needed, the kill switch just needs a real bb_ops.kill_switches table to read.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: blackbook
          POSTGRES_PASSWORD: blackbook
          POSTGRES_DB: blackbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbook -d blackbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Map each cron expression back to its roster job id (functions/src/schedules.ts).
      DISCOVERY_JOB_ID: >-
        ${{
          github.event_name != 'schedule' && inputs.job_id ||
          github.event.schedule == '0 * * * *' && 'discovery-campaign-rss' ||
          github.event.schedule == '0 10 * * 0' && 'community-obscurity-discovery' ||
          github.event.schedule == '0 6 * * 1' && 'discovery-campaign-wikimedia-federal' ||
          github.event.schedule == '0 7 * * 2' && 'discovery-campaign-archive-dpla' ||
          github.event.schedule == '30 8 * * *' && 'discovery-campaign-web-search' ||
          'community-obscurity-discovery'
        }}
      DISCOVERY_MODE: ${{ github.event_name == 'schedule' && 'fixture' || inputs.mode }}
      NODE_ENV: test
      LOG_LEVEL: info
      FIREBASE_PROJECT_ID: demo-repo
      DATABASE_URL: postgresql://blackbook:blackbook@127.0.0.1:5432/blackbook
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DB foundation (creates bb_ops.kill_switches)
        run: pnpm db:init

      - name: Resolve kill switch (bb_ops.kill_switches, Postgres-native)
        id: kill_switch
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "No DATABASE_URL secret configured; failing closed (engaged)."
            echo "state=engaged" >> "$GITHUB_OUTPUT"
          else
            STATE="$(pnpm --filter @repo/admin exec node scripts/check-kill-switch.mjs research-campaigns)"
            echo "kill switch state: $STATE"
            echo "state=$STATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch discovery campaign
        run: |
          set -euo pipefail
          node --conditions development --import tsx packages/operator-cli/src/bin.ts \
            discovery-dispatch --job "$DISCOVERY_JOB_ID" --mode "$DISCOVERY_MODE" \
            --kill-switch "${{ steps.kill_switch.outputs.state }}"
