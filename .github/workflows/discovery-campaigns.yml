# Manual discovery dispatch. Jobs stage private proposals and cannot publish.
name: Discovery campaigns

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Scheduled discovery job id from the roster
        required: true
        type: choice
        options:
          - discovery-campaign-rss
          - discovery-campaign-wikimedia-federal
          - discovery-campaign-archive-dpla
          - discovery-campaign-web-search
          - community-obscurity-discovery
      mode:
        description: Fixture uses checked-in payloads; live may reach external sources
        required: true
        type: choice
        default: fixture
        options:
          - fixture
          - live

permissions:
  contents: read

concurrency:
  group: discovery-campaigns-${{ github.workflow }}-${{ inputs.job_id }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch discovery campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCOVERY_JOB_ID: ${{ inputs.job_id }}
      DISCOVERY_MODE: ${{ inputs.mode }}
      NODE_ENV: test
      LOG_LEVEL: info
      DATABASE_URL: ${{ inputs.mode == 'live' && secrets.RESEARCH_DATABASE_URL || '' }}
      DATABASE_SSL: ${{ inputs.mode == 'live' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve kill switch (ops.kill_switches, Postgres-native)
        id: kill_switch
        run: |
          set -euo pipefail
          if [ "$DISCOVERY_MODE" = fixture ]; then
            echo "state=disengaged" >> "$GITHUB_OUTPUT"
          elif [ -z "${DATABASE_URL:-}" ]; then
            echo "No RESEARCH_DATABASE_URL secret configured; failing closed (engaged)."
            echo "state=engaged" >> "$GITHUB_OUTPUT"
          else
            STATE="$(pnpm --filter @repo/web exec node scripts/check-kill-switch.mjs research-campaigns)"
            echo "kill switch state: $STATE"
            echo "state=$STATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch discovery campaign
        run: |
          set -euo pipefail
          node --conditions development --import tsx packages/operator-cli/src/bin.ts \
            discovery-dispatch --job "$DISCOVERY_JOB_ID" --mode "$DISCOVERY_MODE" \
            --max-candidates 25 --kill-switch "${{ steps.kill_switch.outputs.state }}"
