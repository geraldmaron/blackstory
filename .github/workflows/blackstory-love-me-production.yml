name: BlackStory ad production capture

on:
  push:
    branches: [production/blackstory-love-me-ad-20260920]
    paths:
      - .github/workflows/blackstory-love-me-production.yml

permissions:
  contents: read

concurrency:
  group: blackstory-love-me-production-scout
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read isolated production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install public capture tools
        run: |
          python3 -m venv /tmp/blackstory-ad-tools
          /tmp/blackstory-ad-tools/bin/pip install playwright requests
          /tmp/blackstory-ad-tools/bin/python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb
      - name: Acquire the exact public TikTok post
        run: /tmp/blackstory-ad-tools/bin/python .github/scripts/blackstory-ad-capture.py --mode reference
      - name: Preserve exact reference immediately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blackstory-ad-reference-${{ github.run_number }}
          path: _ad_artifacts/reference/
          retention-days: 14
          if-no-files-found: error
      - name: Capture native BlackStory motion at 1080x1920 and 60fps
        run: /tmp/blackstory-ad-tools/bin/python .github/scripts/blackstory-ad-capture.py --mode capture
      - name: Preserve complete production captures and source
        if: always()
        run: |
          mkdir -p _ad_artifacts/provenance _ad_artifacts/scripts
          cp .github/workflows/blackstory-love-me-production.yml _ad_artifacts/scripts/capture-workflow.yml
          /tmp/blackstory-ad-tools/bin/pip freeze > _ad_artifacts/provenance/python-versions.txt
          ffmpeg -version > _ad_artifacts/provenance/ffmpeg-version.txt
      - name: Upload motion footage and inspection records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blackstory-ad-captures-${{ github.run_number }}
          path: _ad_artifacts/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
