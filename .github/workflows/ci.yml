# BlackStory pull request quality gates and repository governance.
# Stable job names below are wired into infra/github/rulesets/main-protection.json.
# Permissions stay read-only. Third-party actions are pinned to immutable SHAs.
# Do not use pull_request_target.
#
# Efficiency: Detect Changes gates heavy lanes. Job-level skips (not workflow paths-ignore)
# so required checks still report Success on docs/mobile-only PRs. Mobile is not required.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  LOG_LEVEL: info

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      mobile: ${{ steps.detect.outputs.mobile }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect path changes
        id: detect
        uses: ./.github/actions/detect-changes

  # Separate build checks from tests so tests resolve an unbuilt workspace.
  # Consolidated steps share installation work; failures report at the step level.
  workspace-checks:
    name: Workspace Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Boundary validation and lint
        run: pnpm validate
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck

  workspace-tests:
    name: Workspace Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
      # Fail closed on production identifiers before any test can access services.
      - name: Test preflight (fail closed on production identifiers)
        run: pnpm test:preflight
      - name: Run package tests
        run: pnpm -r --filter './packages/**' run --if-present test
      - name: Run app tests
        run: pnpm -r --filter './apps/**' run --if-present test
      - name: Contract tests
        run: pnpm test:contract
      - name: Security corpus and production guards
        run: pnpm test:security
      - name: Accessibility smoke fixtures
        run: pnpm test:a11y
      - name: Testing package coverage thresholds
        run: pnpm test:coverage
      - name: E2E harness (skip without E2E_BASE_URL; no silent retries)
        run: pnpm test:e2e

  # Mobile owns its npm lockfile and is excluded from the pnpm workspace.
  # Run its checks together, with cheap static checks before Jest.
  mobile-checks:
    name: Mobile Checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies (npm, isolated lockfile)
        run: npm ci --no-audit --no-fund
      - name: Generate expo-env.d.ts (gitignored Expo type-reference shim)
        # Expo generates this file locally on first `expo start`/`expo prebuild`; it is
        # intentionally gitignored (apps/mobile/.gitignore) so every clean checkout —
        # including CI — must recreate it before `tsc` can resolve `expo/types`.
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - name: Prettier (format:check)
        run: npm run format:check
      - name: ESLint (eslint-config-expo, warnings fail)
        run: npm run lint
      - name: Typecheck (app + test/tooling project)
        run: npm run typecheck
      - name: Jest (jest-expo preset)
        run: npm test -- --ci
      # The two gates the release program names that nothing here was running. Doctor is the
      # only check that looks at the PROJECT rather than the source -- config plugins, native
      # directories against app.config.ts, the SDK's own peer expectations -- and it is exactly
      # the class of drift that does not show up until a store build. `--check` is its
      # dependency half, run separately so a version mismatch reads as a version mismatch
      # rather than as one of Doctor's twenty-one checks.
      #
      # Both are pinned to the SDK's own CLI rather than `@latest`: a gate whose definition of
      # passing can change without a commit is not a gate.
      - name: Expo Doctor (project health against the installed SDK)
        # `expo-doctor` is a pinned devDependency, not `npx expo-doctor@latest`: a gate whose
        # definition of passing can change without a commit is not a gate, and `--no-install`
        # would silently resolve from a warm npx cache locally and fail on a clean runner.
        run: npm run doctor
      - name: Expo dependency alignment
        # Deliberate deviations are declared in package.json `expo.install.exclude`, with the
        # reason beside them. Anything not declared there is drift and fails here.
        run: npm run deps:check

  unit-py:
    name: Unit Tests (Python)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL https://astral.sh/uv/install.sh | sh; then
              exit 0
            fi
            echo "uv install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "uv install failed after retries" >&2
          exit 1
      - name: Sync Python workspace
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --all-packages --frozen
      - name: Setup Node and pnpm (for shared preflight)
        uses: ./.github/actions/setup-node-pnpm
      - name: Test preflight
        run: pnpm test:preflight
      - name: Run pytest
        run: uv run pytest

  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate workflow pins, permissions, and governance files
        # No dependency install: checker uses only Node builtins + checked-in scripts.
        run: node scripts/validate-github-governance.mjs
