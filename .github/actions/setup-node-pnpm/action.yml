# Shared Node + pnpm install for CI/security/deploy jobs.
# Pins match .github/workflows; keep SHAs in sync when bumping actions.
name: Setup Node and pnpm
description: Install pnpm and Node (.nvmrc), optionally with a frozen lockfile install

inputs:
  install:
    description: When true, run pnpm install --frozen-lockfile
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 9.12.3
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install JavaScript dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
